<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Play Shqip - LIVE Score Pro</title>

    <style>
        :root {
            --bg-main: #070a0f;
            --card-bg: linear-gradient(145deg, #160a0a, #0d0303);
            --card-border: #2a1010;
            --accent-red: #e10600;
            --text-main: #ffffff;
            --text-sub: #a0a5b5;
            --live-bg: linear-gradient(145deg, #1a0808, #2a0a0a);
            --live-border: #ff2200;
            --live-glow: rgba(255, 34, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .header {
            height: 75px;
            background: #0a0101;
            border-bottom: 2px solid var(--accent-red);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 4px 20px rgba(225, 6, 0, 0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
        }

        .play-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid var(--accent-red);
        }

        .logo-text span {
            font-size: 24px;
            color: #fff;
            letter-spacing: 1px;
            display: block;
        }

        .logo-text small {
            font-size: 11px;
            color: var(--accent-red);
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(225, 6, 0, 0.15);
            border: 1px solid var(--accent-red);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: var(--accent-red);
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 6, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(225, 6, 0, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 6, 0, 0); }
        }

        .wrap {
            height: calc(100vh - 75px);
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-red) #0b0e14;
        }

        .match {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 18px;
            padding: 18px 24px;
            margin-bottom: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            animation: fadeIn 0.3s ease;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .match.live {
            background: var(--live-bg) !important;
            border: 3px solid var(--live-border) !important;
            box-shadow: 0 0 30px var(--live-glow), inset 0 0 30px rgba(255, 34, 0, 0.05) !important;
            transform: scale(1.02);
        }

        .match.live .league-header {
            color: #ff6b6b !important;
            border-bottom-color: #ff2200 !important;
        }

        .match.live .score-box {
            font-size: 34px !important;
            background: #1a0505 !important;
            border-color: #ff2200 !important;
            box-shadow: 0 0 30px rgba(255, 34, 0, 0.5) !important;
            animation: scorePulse 1.5s infinite;
        }

        @keyframes scorePulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 34, 0, 0.5); }
            50% { box-shadow: 0 0 60px rgba(255, 34, 0, 0.8); }
        }

        .match.live .status-badge {
            background: #ff2200 !important;
            font-size: 13px !important;
            padding: 6px 16px !important;
            animation: pulse 1s infinite;
        }

        .live-time {
            display: inline-block;
            background: #ff2200;
            color: #fff;
            font-weight: 900;
            font-size: 18px;
            padding: 4px 14px;
            border-radius: 8px;
            margin-top: 6px;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
            animation: timePulse 1s infinite;
        }

        @keyframes timePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .live-badge-corner {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ff2200;
            color: #fff;
            font-size: 11px;
            font-weight: 900;
            padding: 3px 12px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse 1s infinite;
        }

        .match:not(.live) .live-badge-corner {
            display: none;
        }

        .tv-focus {
            border-color: var(--accent-red) !important;
            transform: scale(1.02);
            box-shadow: 0 0 22px rgba(225, 6, 0, 0.7) !important;
            outline: none;
        }

        .match.live.tv-focus {
            border-color: #ff4400 !important;
            box-shadow: 0 0 40px rgba(255, 68, 0, 0.9), 0 0 80px rgba(255, 34, 0, 0.3) !important;
            transform: scale(1.05);
        }

        .league-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #d19ca0;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 14px;
            border-bottom: 1px dashed #2d1414;
            padding-bottom: 8px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team {
            width: 38%;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 19px;
            font-weight: 800;
        }

        .team.home { justify-content: flex-start; text-align: left; }
        .team.away { justify-content: flex-end; text-align: right; }

        .team img {
            width: 46px;
            height: 46px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .center {
            text-align: center;
            min-width: 150px;
        }

        .score-box {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
            background: #1e0505;
            padding: 4px 20px;
            border-radius: 10px;
            border: 1px solid #4a1010;
            display: inline-block;
            min-width: 90px;
        }

        .time-box {
            font-size: 17px;
            color: #ff8a80;
            font-weight: bold;
        }

        .status-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-upcoming {
            background: #201212;
            color: #ff8a80;
            border: 1px solid #5c1d1d;
        }

        .broadcasters {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .channel-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(225, 6, 0, 0.12);
            border: 1px solid var(--accent-red);
            padding: 4px 10px;
            border-radius: 6px;
            color: #ff5252;
            font-size: 12px;
            font-weight: bold;
        }

        .channel-tag img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            border-radius: 3px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-sub);
            font-size: 18px;
        }

        .live-count {
            background: rgba(225, 6, 0, 0.2);
            color: var(--accent-red);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 8px;
        }

        .filters {
            display: flex;
            gap: 10px;
            padding: 0 20px 15px 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .filter-btn:hover {
            border-color: var(--accent-red);
            color: #fff;
        }

        .filter-btn.active {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">
            <img class="play-logo" src="https://i.ibb.co/Kpd6bW8X/logo-256.png" alt="Play Shqip Logo" onerror="this.src='https://via.placeholder.com/48?text=PS'">
            <div class="logo-text">
                <span>PLAY SHQIP</span>
                <small>LIVE SCORE PRO</small>
            </div>
        </div>

        <div class="live-indicator">
            <div class="pulse-dot"></div>
            <span>LIVE</span>
            <span class="live-count" id="liveCount">0</span>
        </div>
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">Të Gjitha</button>
        <button class="filter-btn" data-filter="live">🔴 LIVE</button>
        <button class="filter-btn" data-filter="upcoming">⏰ Në Pritje</button>
    </div>

    <div class="wrap" id="games">
        <div class="empty-state">Duke ngarkuar ndeshjet...</div>
    </div>

    <script>
        const tvLogos = {
            "Super Sport AL": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkn0aMGtp1VLY3UMIrfsiyD1PBe-k-NBvnRtZOWep4iQ&s=10",
            "Tring Sport AL": "https://play-lh.googleusercontent.com/xj8GLCiviP_leV_eIzw3o-MLIzkNx7Uq6lW3VT7u9A3ZhpMenjJQyzc2egadTkEKSIaOnyIg4UASqUO2VL-nGQ",
            "Art Sport KS": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8GbjNRnIknmPljrVN4I0qixtO3cClJOnmvg&s",
            "RTSH Sport AL": "https://r2.thesportsdb.com/images/media/channel/logo/nfdq4d1630964082.png"
        };

        function getBroadcasters(leagueName) {
            let channels = [];
            const l = (leagueName || "").toLowerCase();

            if (l.includes("premier") || l.includes("la liga") || l.includes("bundesliga") || 
                l.includes("ligue 1") || l.includes("europa") || l.includes("conference") || 
                l.includes("nations") || l.includes("world cup") || l.includes("euro") || 
                l.includes("fa cup") || l.includes("copa del rey") || l.includes("eredivisie") || 
                l.includes("saudi") || l.includes("carabao") || l.includes("dfb")) {
                channels.push("Super Sport AL");
            }

            if (l.includes("serie a") || l.includes("champions") || l.includes("coppa italia") || 
                l.includes("primeira") || l.includes("super lig") || l.includes("turkish")) {
                channels.push("Tring Sport AL");
            }

            if (l.includes("champions") || l.includes("europa") || l.includes("conference") || 
                l.includes("serie a") || l.includes("la liga") || l.includes("ligue 1")) {
                channels.push("Art Sport KS");
            }

            if (l.includes("albania") || l.includes("superliga") || l.includes("shqiperi") || 
                l.includes("kupa e shqiperise") || l.includes("rtsh")) {
                channels.push("RTSH Sport AL");
            }

            if (channels.length === 0) {
                channels.push("Super Sport AL", "Art Sport KS");
            }

            channels = [...new Set(channels)];

            return channels.map(ch => `
                <div class="channel-tag">
                    <img src="${tvLogos[ch] || 'https://via.placeholder.com/18'}" alt="${ch}">
                    ${ch}
                </div>
            `).join("");
        }

        let cards = [];
        let focusIndex = 0;
        let autoScroll = true;
        let autoScrollTimer = null;
        let refreshTimer = null;
        let liveCount = 0;
        let currentFilter = 'all';
        let matchesData = [];

        function formatDateTime(utcDateStr) {
            if (!utcDateStr) return "--:--";
            const date = new Date(utcDateStr);
            const today = new Date();
            
            const isToday = date.getDate() === today.getDate() &&
                            date.getMonth() === today.getMonth() &&
                            date.getFullYear() === today.getFullYear();

            const timeStr = date.toLocaleTimeString("sq-AL", { hour: "2-digit", minute: "2-digit", hour12: false });
            
            if (isToday) {
                return `Sot ${timeStr}`;
            } else {
                return `${date.getDate()}/${date.getMonth()+1} - ${timeStr}`;
            }
        }

        function getWeekDateRange() {
            const start = new Date();
            const end = new Date();
            end.setDate(start.getDate() + 7);

            const formatDate = (d) => {
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                return `${yyyy}${mm}${dd}`;
            };

            return `${formatDate(start)}-${formatDate(end)}`;
        }

        const ESPN_LEAGUES = [
            "eng.1", "esp.1", "ita.1", "ger.1", "fra.1",
            "uefa.champions", "uefa.europa", "uefa.europa.conf",
            "fifa.world", "uefa.nations", "por.1", "ned.1",
            "tur.1", "sau.1", "eng.fa", "eng.league_cup",
            "esp.copa", "ita.coppa", "ger.pokal"
        ];

        async function fetchESPNLeagues() {
            const matches = [];
            const dateRange = getWeekDateRange();

            const fetches = ESPN_LEAGUES.map(league => 
                fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/scoreboard?dates=${dateRange}`)
                    .then(r => r.ok ? r.json() : null)
                    .catch(() => null)
            );

            const results = await Promise.all(fetches);

            const now = new Date();
            now.setHours(0, 0, 0, 0);

            const maxWeekDate = new Date();
            maxWeekDate.setDate(now.getDate() + 7);
            maxWeekDate.setHours(23, 59, 59, 999);

            results.forEach(data => {
                if (!data || !data.events) return;
                data.events.forEach(event => {
                    const comp = event.competitions?.[0];
                    if (!comp) return;

                    const matchDate = new Date(event.date);
                    if (matchDate < now || matchDate > maxWeekDate) return;

                    const home = comp.competitors?.find(c => c.homeAway === 'home');
                    const away = comp.competitors?.find(c => c.homeAway === 'away');
                    const statusState = event.status?.type?.state;

                    if (statusState === "post") return;

                    matches.push({
                        id: event.id,
                        league: comp.league?.name || data.leagues?.[0]?.name || "Futboll",
                        homeTeam: home?.team?.displayName || home?.team?.name || "Home",
                        homeBadge: home?.team?.logo || "https://via.placeholder.com/46",
                        awayTeam: away?.team?.displayName || away?.team?.name || "Away",
                        awayBadge: away?.team?.logo || "https://via.placeholder.com/46",
                        time: event.date,
                        isLive: statusState === "in",
                        isFinished: statusState === "post",
                        elapsed: event.status?.displayClock || "",
                        period: event.status?.period || 0,
                        periodDisplay: event.status?.type?.shortDetail || "",
                        scoreHome: home?.score ?? 0,
                        scoreAway: away?.score ?? 0
                    });
                });
            });

            return matches;
        }

        async function loadMatches() {
            try {
                let allMatches = await fetchESPNLeagues();

                const uniqueMap = new Map();
                allMatches.forEach(m => uniqueMap.set(m.id, m));
                allMatches = Array.from(uniqueMap.values());

                let activeMatches = allMatches.filter(m => !m.isFinished);

                activeMatches.sort((a, b) => {
                    if (a.isLive && !b.isLive) return -1;
                    if (!a.isLive && b.isLive) return 1;
                    return new Date(a.time) - new Date(b.time);
                });

                matchesData = activeMatches;
                renderUI(activeMatches);

            } catch (err) {
                console.error("Gabim:", err);
                document.getElementById("games").innerHTML = `<div class="empty-state">Gabim në ngarkim: ${err.message}</div>`;
            }

            clearTimeout(refreshTimer);
            refreshTimer = setTimeout(loadMatches, 15000);
        }

        function renderUI(matches) {
            const container = document.getElementById("games");
            liveCount = 0;

            let filtered = matches;
            if (currentFilter === 'live') {
                filtered = matches.filter(m => m.isLive);
            } else if (currentFilter === 'upcoming') {
                filtered = matches.filter(m => !m.isLive);
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">Nuk ka ndeshje për këtë filtrim</div>`;
                document.getElementById("liveCount").textContent = matches.filter(m => m.isLive).length;
                return;
            }

            liveCount = matches.filter(m => m.isLive).length;
            document.getElementById("liveCount").textContent = liveCount;

            container.innerHTML = filtered.map((m, idx) => {
                const isLive = m.isLive;
                let statusHTML, scoreHTML;

                if (isLive) {
                    const periodText = m.periodDisplay || 
                                      (m.period === 1 ? "PJESA 1" : 
                                       m.period === 2 ? "PJESA 2" : 
                                       m.period > 0 ? `PJESA ${m.period}` : "");
                    
                    const clockDisplay = m.elapsed ? `${m.elapsed}'` : '';
                    
                    statusHTML = `
                        <div class="live-time">⏱️ ${clockDisplay}</div>
                        <span class="status-badge">🔴 LIVE ${periodText}</span>
                    `;
                    scoreHTML = `<div class="score-box">${m.scoreHome} - ${m.scoreAway}</div>`;
                } else {
                    statusHTML = `<span class="status-badge status-upcoming">⏰ ${formatDateTime(m.time)}</span>`;
                    scoreHTML = `<div class="time-box">${formatDateTime(m.time)}</div>`;
                }

                const liveClass = isLive ? 'live' : '';
                const liveBadge = isLive ? `<div class="live-badge-corner">🔴 LIVE</div>` : '';

                return `
                    <div class="match ${liveClass}" tabindex="${idx + 1}" data-live="${isLive}" data-index="${idx}">
                        ${liveBadge}
                        <div class="league-header">
                            <span>🏆 ${m.league}</span>
                            <span>PLAY SHQIP</span>
                        </div>

                        <div class="row">
                            <div class="team home">
                                <img src="${m.homeBadge}" onerror="this.src='https://via.placeholder.com/46'">
                                <span>${m.homeTeam}</span>
                            </div>

                            <div class="center">
                                ${scoreHTML}
                                ${statusHTML}
                            </div>

                            <div class="team away">
                                <span>${m.awayTeam}</span>
                                <img src="${m.awayBadge}" onerror="this.src='https://via.placeholder.com/46'">
                            </div>
                        </div>

                        <div class="broadcasters">
                            ${getBroadcasters(m.league)}
                        </div>
                    </div>
                `;
            }).join("");

            cards = [...document.querySelectorAll(".match")];
            
            let firstLive = document.querySelector(".match.live");
            if (firstLive) {
                focusIndex = cards.indexOf(firstLive);
            } else {
                focusIndex = 0;
            }

            cards.forEach((c, i) => {
                c.classList.toggle("tv-focus", i === focusIndex);
                if (i === focusIndex) {
                    c.scrollIntoView({ behavior: "smooth", block: "center" });
                }
            });
        }

        // ===== KONTROLLI I PLOTË PËR REMOTE TV =====
        document.addEventListener("keydown", function(e) {
            if (!cards.length) return;

            const key = e.key;
            
            autoScroll = false;
            clearTimeout(autoScrollTimer);
            autoScrollTimer = setTimeout(() => { autoScroll = true; }, 15000);

            cards.forEach(c => c.classList.remove("tv-focus"));

            if (key === "ArrowDown" || key === "ArrowRight") {
                e.preventDefault();
                focusIndex = (focusIndex + 1) % cards.length;
            } else if (key === "ArrowUp" || key === "ArrowLeft") {
                e.preventDefault();
                focusIndex = (focusIndex - 1 + cards.length) % cards.length;
            } else if (key === "Enter" || key === " ") {
                e.preventDefault();
                if (cards[focusIndex]) {
                    const idx = parseInt(cards[focusIndex].dataset.index);
                    const m = matchesData[idx];
                    if (m) {
                        if (m.isLive) {
                            alert(`🔴 LIVE: ${m.homeTeam} vs ${m.awayTeam}\nRezultati: ${m.scoreHome} - ${m.scoreAway}\nMinuta: ${m.elapsed || '0'}'`);
                        } else {
                            alert(`⏰ Ndeshje: ${m.homeTeam} vs ${m.awayTeam}\nLiga: ${m.league}\nOra: ${formatDateTime(m.time)}`);
                        }
                    }
                }
            } else if (key === "Backspace" || key === "Escape") {
                e.preventDefault();
                focusIndex = 0;
                if (cards[0]) {
                    cards[0].classList.add("tv-focus");
                }
            }

            if (cards[focusIndex]) {
                cards[focusIndex].classList.add("tv-focus");
                cards[focusIndex].scrollIntoView({ behavior: "smooth", block: "center" });
            }
        });

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                loadMatches();
            });
        });

        // Auto-scroll
        const wrapEl = document.querySelector(".wrap");
        (function autoScrollLoop() {
            if (autoScroll && wrapEl.scrollHeight > wrapEl.clientHeight) {
                wrapEl.scrollTop += 1;
                if (wrapEl.scrollTop >= wrapEl.scrollHeight - wrapEl.clientHeight) {
                    wrapEl.scrollTop = 0;
                }
            }
            requestAnimationFrame(autoScrollLoop);
        })();

        // Nisja
        loadMatches();
    </script>
</body>

</html>
