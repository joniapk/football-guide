<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PLAY SHQIP - Ndeshjet e 7 Ditëve & Live</title>

    <style>
        :root {
            --bg-main: #05070a;
            --card-bg: linear-gradient(135deg, #18090a 0%, #0c0e14 100%);
            --card-border: rgba(225, 6, 0, 0.25);
            --accent-red: #ff1100;
            --accent-glow: rgba(255, 17, 0, 0.85);
            --text-main: #ffffff;
            --text-sub: #a0a8bc;
            --gold-accent: #ffb700;
            --play-yellow: #ffcc00;
            --play-header: #1e1e1e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            background: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .header {
            height: 72px;
            background: linear-gradient(180deg, #0e0202 0%, #05070a 100%);
            border-bottom: 3px solid var(--accent-red);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 6px 30px rgba(255, 17, 0, 0.25);
            flex-shrink: 0;
            z-index: 10;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
        }

        .play-logo {
            width: 46px;
            height: 46px;
            object-fit: contain;
            border-radius: 50%;
            border: 3px solid var(--accent-red);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .logo-text span {
            font-size: 22px;
            color: #fff;
            letter-spacing: 2px;
            display: block;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            line-height: 1.1;
        }

        .logo-text small {
            font-size: 10px;
            color: var(--accent-red);
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 17, 0, 0.15);
            border: 2px solid var(--accent-red);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 17, 0, 0.2);
            white-space: nowrap;
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255,17,0,0.8); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(255,17,0,0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255,17,0,0); }
        }

        .wrap {
            height: calc(100vh - 72px);
            overflow-y: auto;
            padding: 16px 20px;
            scroll-behavior: auto;
            scrollbar-width: none;
            flex: 1;
            position: relative;
        }
        .wrap::-webkit-scrollbar { display: none; }

        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 4px solid var(--accent-red);
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* ===== NDESHJA E DITËS ===== */
        .match-of-day {
            grid-column: 1 / -1;
            border: 3px solid var(--gold-accent) !important;
            background: linear-gradient(135deg, #1a1208 0%, #0c0e14 100%) !important;
            box-shadow: 0 0 40px rgba(255, 183, 0, 0.25) !important;
            position: relative;
            padding: 18px 20px !important;
            border-radius: 20px !important;
        }

        .match-of-day::before {
            content: "⭐ NDESHJA E DITËS";
            position: absolute;
            top: -12px;
            right: 24px;
            background: var(--gold-accent);
            color: #000;
            font-weight: 900;
            font-size: 14px;
            padding: 3px 18px;
            border-radius: 20px;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 183, 0, 0.4);
            z-index: 2;
        }

        .match-of-day.is-live-card {
            border-color: var(--accent-red) !important;
            box-shadow: 0 0 40px rgba(255, 17, 0, 0.35) !important;
        }

        .match-of-day.is-live-card::before {
            content: "🔴 LIVE - NDESHJA E DITËS";
            background: var(--accent-red);
            color: #fff;
        }

        .match-of-day .league-header .league-brand {
            background: rgba(255, 183, 0, 0.3);
            border-color: var(--gold-accent);
            color: var(--gold-accent);
        }

        .match-of-day .team {
            font-size: 20px !important;
        }

        .match-of-day .team img {
            width: 48px !important;
            height: 48px !important;
        }

        .match-of-day .score-box {
            font-size: 32px !important;
            padding: 6px 20px !important;
        }

        .match-of-day .time-box {
            font-size: 16px !important;
            padding: 4px 16px !important;
        }

        .match-of-day.tv-focus {
            transform: scale(1.03);
            box-shadow: 0 0 60px var(--accent-glow) !important;
        }

        /* Kartelat normale */
        .match {
            background: var(--card-bg);
            border: 2.5px solid var(--card-border);
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.8);
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .match.is-live-card {
            border: 3px solid var(--accent-red);
            background: linear-gradient(135deg, #2b080a 0%, #0c0e14 100%);
            box-shadow: 0 0 30px rgba(255, 17, 0, 0.35);
        }

        .tv-focus {
            border: 4px solid var(--accent-red) !important;
            transform: scale(1.04);
            box-shadow: 0 0 45px var(--accent-glow) !important;
            outline: none;
            background: linear-gradient(135deg, #380d10 0%, #121620 100%);
            z-index: 5;
        }

        .match-of-day.tv-focus {
            transform: scale(1.03);
            box-shadow: 0 0 60px rgba(255, 183, 0, 0.5) !important;
            border-color: var(--gold-accent) !important;
        }

        .match-of-day.is-live-card.tv-focus {
            border-color: var(--accent-red) !important;
            box-shadow: 0 0 60px var(--accent-glow) !important;
        }

        .league-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--gold-accent);
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 8px;
            border-bottom: 1px dashed rgba(255, 183, 0, 0.25);
            padding-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .league-brand {
            color: #fff;
            font-size: 11px;
            background: rgba(225, 6, 0, 0.3);
            padding: 2px 10px;
            border-radius: 6px;
            border: 1px solid var(--accent-red);
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .team {
            width: 34%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .team.home { justify-content: flex-start; }
        .team.away { justify-content: flex-end; }

        .team img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            padding: 4px;
            border: 2px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }

        .center {
            text-align: center;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .score-box {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
            background: #2b0305;
            padding: 4px 14px;
            border-radius: 12px;
            border: 2px solid #821013;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(225,6,0,0.5);
        }

        .time-box {
            font-size: 14px;
            color: #ff8a80;
            font-weight: 800;
            background: rgba(0,0,0,0.5);
            padding: 3px 12px;
            border-radius: 8px;
            border: 1.5px solid rgba(255,138,128,0.3);
            white-space: nowrap;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-live {
            background: var(--accent-red);
            color: #fff;
            animation: pulse 1.5s infinite;
        }

        .play-odds-mini {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .play-odd-mini {
            background: #111215;
            border: 1px solid #282a30;
            border-radius: 8px;
            padding: 4px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 700;
        }

        .play-odd-mini .odd-label {
            color: var(--text-sub);
            font-weight: 400;
            font-size: 12px;
        }

        .play-odd-mini .odd-val {
            color: var(--play-yellow);
            font-weight: 900;
            font-size: 16px;
        }

        .card-scorers {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            padding-top: 4px;
            border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 12px;
            color: var(--text-sub);
        }

        .card-scorers .home-scorers { text-align: left; width: 45%; }
        .card-scorers .away-scorers { text-align: right; width: 45%; }
        .scorer-item { margin-bottom: 1px; }

        .update-timestamp {
            text-align: right;
            font-size: 11px;
            color: var(--text-sub);
            padding: 6px 4px 0 0;
            opacity: 0.7;
        }

        /* MODAL FULL SCREEN */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.96);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 0;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #0d0f17;
            border: 3px solid var(--accent-red);
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.97);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            background: linear-gradient(180deg, #240a0b 0%, #0d0f17 100%);
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            flex-shrink: 0;
        }

        .modal-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }

        .modal-team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 35%;
            font-size: 22px;
            font-weight: bold;
        }

        .modal-team img { width: 64px; height: 64px; object-fit: contain; }

        .modal-score {
            font-size: 44px;
            font-weight: 900;
            color: #fff;
            background: #000;
            padding: 4px 24px;
            border-radius: 12px;
            border: 2px solid var(--accent-red);
            letter-spacing: 2px;
        }

        .modal-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            background: #05070a;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .tab-btn {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.15s ease;
            min-width: 130px;
        }

        .tab-btn.active-tab {
            background: var(--accent-red) !important;
            border-color: #fff !important;
            box-shadow: 0 0 20px var(--accent-glow) !important;
        }

        .tab-btn.tv-focus {
            border-color: #fff !important;
            transform: scale(1.08);
            box-shadow: 0 0 25px #fff !important;
        }

        .close-tab-btn { background: #4a0d0e; border-color: #ff3333; }

        .modal-body {
            padding: 20px 28px;
            overflow-y: auto;
            flex: 1;
            font-size: 17px;
            scroll-behavior: smooth;
        }

        .modal-body.tv-focus {
            outline: 2px solid var(--accent-red);
            background: rgba(255,17,0,0.02);
        }

        .play-container { display: flex; flex-direction: column; gap: 20px; }
        .play-badge-header {
            background: var(--play-header);
            border: 2px solid var(--play-yellow);
            padding: 14px 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.25);
        }
        .play-logo-badge {
            font-weight: 900;
            font-size: 30px;
            color: #fff;
            background: #000;
            padding: 2px 16px;
            border-radius: 6px;
            font-style: italic;
            border: 1px solid var(--play-yellow);
            letter-spacing: 2px;
        }
        .play-odds-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-top: 6px;
        }
        .play-odd-card {
            background: #111215;
            border: 1px solid #282a30;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .play-odd-card .odd-title {
            font-size: 15px;
            color: var(--text-sub);
            margin-bottom: 4px;
            font-weight: bold;
        }
        .play-odd-card .odd-val {
            font-size: 26px;
            font-weight: 900;
            color: var(--play-yellow);
            background: #000;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(255, 204, 0, 0.3);
        }

        .pitch-container {
            background: linear-gradient(180deg, #184e2a 0%, #0d321a 100%);
            border: 3px solid #2e8b46;
            border-radius: 16px;
            padding: 20px;
            margin-top: 12px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        .pitch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .formation-title {
            color: var(--play-yellow);
            font-weight: 800;
            font-size: 19px;
        }
        .lineups-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .lineup-column h4 {
            color: var(--gold-accent);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
            margin-top: 0;
            font-size: 22px;
        }
        .section-sub-header {
            color: #ff8a80;
            font-size: 17px;
            font-weight: bold;
            margin: 12px 0 6px 0;
            text-transform: uppercase;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }
        .player-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 7px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 17px;
        }
        .player-num {
            color: var(--accent-red);
            font-weight: bold;
            width: 30px;
        }

        /* Stilizim për lojtarët më të mirë */
        .top-players-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .top-player-team {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .top-player-team h3 {
            color: var(--gold-accent);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            margin-top: 0;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-player-team h3 img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 50%;
        }
        .top-player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .top-player-item .player-name {
            font-weight: 600;
            font-size: 16px;
        }
        .top-player-item .player-stats {
            display: flex;
            gap: 14px;
            font-size: 14px;
            color: var(--text-sub);
        }
        .top-player-item .player-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .top-player-item .player-stats .stat-highlight {
            color: var(--play-yellow);
            font-weight: 700;
        }
        .top-player-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-sub);
            font-size: 18px;
        }

        .stat-row { margin-bottom: 18px; }
        .stat-labels {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 4px;
        }
        .stat-bar-bg {
            height: 16px;
            background: #1a1d28;
            border-radius: 8px;
            display: flex;
            overflow: hidden;
        }
        .stat-bar-home { background: var(--accent-red); height: 100%; }
        .stat-bar-away { background: var(--gold-accent); height: 100%; }

        .timeline-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 17px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .timeline-time {
            width: 80px;
            font-weight: bold;
            color: var(--gold-accent);
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-sub);
            font-size: 22px;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 820px) {
            .games-grid { grid-template-columns: 1fr; }
            .header { padding: 0 12px; height: 62px; }
            .play-logo { width: 36px; height: 36px; }
            .logo-text span { font-size: 18px; }
            .logo-text small { font-size: 9px; }
            .live-indicator { font-size: 12px; padding: 4px 12px; }
            .team { font-size: 15px; }
            .team img { width: 32px; height: 32px; }
            .center { min-width: 100px; }
            .score-box { font-size: 22px; padding: 2px 10px; }
            .time-box { font-size: 12px; padding: 2px 8px; }
            .play-odd-mini { font-size: 12px; padding: 2px 10px; }
            .play-odd-mini .odd-val { font-size: 14px; }
            .modal-team { font-size: 18px; }
            .modal-team img { width: 50px; height: 50px; }
            .modal-score { font-size: 34px; padding: 2px 16px; }
            .tab-btn { font-size: 15px; padding: 10px 16px; min-width: 90px; }
            .modal-body { padding: 16px 18px; font-size: 16px; }
            .play-logo-badge { font-size: 24px; }
            .play-odd-card .odd-val { font-size: 22px; }
            .player-row { font-size: 16px; }
            .stat-labels { font-size: 16px; }
            .timeline-item { font-size: 16px; }
            .timeline-time { font-size: 20px; width: 70px; }
            .top-players-grid { grid-template-columns: 1fr; }
            .top-player-item .player-stats { font-size: 13px; gap: 10px; }
            
            .match-of-day::before {
                font-size: 12px;
                padding: 2px 14px;
                top: -10px;
                right: 16px;
            }
            .match-of-day .team {
                font-size: 17px !important;
            }
            .match-of-day .team img {
                width: 38px !important;
                height: 38px !important;
            }
            .match-of-day .score-box {
                font-size: 26px !important;
                padding: 4px 14px !important;
            }
        }

        @media (max-width: 480px) {
            .team { font-size: 13px; gap: 4px; }
            .team img { width: 26px; height: 26px; }
            .center { min-width: 80px; }
            .score-box { font-size: 18px; padding: 2px 8px; }
            .time-box { font-size: 11px; padding: 2px 6px; }
            .play-odd-mini { font-size: 11px; padding: 2px 6px; }
            .play-odd-mini .odd-val { font-size: 12px; }
            .modal-team { font-size: 15px; }
            .modal-team img { width: 40px; height: 40px; }
            .modal-score { font-size: 26px; padding: 2px 12px; }

<body>

    <div class="header">
        <div class="logo">
            <img class="play-logo" src="https://i.ibb.co/Kpd6bW8X/logo-256.png" alt="Play Shqip Logo" onerror="this.src='https://via.placeholder.com/56?text=PS'">
            <div class="logo-text">
                <span>PLAY SHQIP</span>
                <small>LIGAT ELITARE & LIVE</small>
            </div>
        </div>
        <div class="live-indicator">
            <div class="pulse-dot"></div>
            <span>7 DITËT & LIVE</span>
        </div>
    </div>

    <div class="wrap" id="games">
        <div class="empty-state">
            <div class="loader"></div><br>
            Duke ngarkuar ndeshjet elitare...
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="matchModal">
        <div class="modal-content">
            <div class="modal-header">
                <div id="modalLeague" style="color: var(--gold-accent); font-weight: bold; font-size: 17px; text-transform: uppercase;">--</div>
                <div class="modal-teams">
                    <div class="modal-team">
                        <img id="modalHomeLogo" src="" alt="">
                        <span id="modalHomeName">--</span>
                    </div>
                    <div>
                        <div class="modal-score" id="modalScore">- : -</div>
                        <div id="modalStatus" style="margin-top: 6px; font-weight: bold; color: var(--accent-red); font-size: 17px;">--</div>
                    </div>
                    <div class="modal-team">
                        <img id="modalAwayLogo" src="" alt="">
                        <span id="modalAwayName">--</span>
                    </div>
                </div>
            </div>
            <div class="modal-tabs">
                <button class="tab-btn active-tab" id="modalTab0" onclick="switchTab(0)">⚽ Formati & Koeficientët</button>
                <button class="tab-btn" id="modalTab1" onclick="switchTab(1)">👕 Formacionet</button>
                <button class="tab-btn" id="modalTab2" onclick="switchTab(2)">📊 Statistikat</button>
                <button class="tab-btn" id="modalTab3" onclick="switchTab(3)">⚡ Golat & Ngjarjet</button>
                <button class="tab-btn" id="modalTab4" onclick="switchTab(4)">🏅 Lojtarët më të mirë</button>
                <button class="tab-btn close-tab-btn" id="modalTab5" onclick="closeModal()">✖ Mbyll (ESC)</button>
            </div>
            <div class="modal-body" id="modalTabContent" tabindex="0"></div>
        </div>
    </div>

    <script>
        // --- KONFIGURIMI ---
        const CACHE_DURATION = 60000;
        let cachedMatches = null;
        let cacheTimestamp = 0;
        let refreshTimer = null;
        let cards = [];
        let matchesData = [];
        let focusIndex = 0;
        let focusedMatchId = null;
        let autoScroll = true;
        let isPaused = false;
        let scrollSpeed = 0;
        let targetSpeed = 1.0;
        let lastTimestamp = 0;
        let isModalOpen = false;
        let modalFocusArea = 'TABS';
        let modalTabIndex = 0;
        let activeMatch = null;
        let activeSummary = null;
        let scrollRestartTimer = null;

        // --- PRIORITETI I LIGAVE PËR NDESHJEN E DITËS ---
        const LEAGUE_PRIORITY = {
            "uefa.champions": 10,
            "uefa.europa": 9,
            "uefa.europa.conf": 8,
            "eng.1": 7,
            "esp.1": 7,
            "ita.1": 7,
            "ger.1": 7,
            "fra.1": 7,
            "alb.1": 5,
            "por.1": 4,
            "ned.1": 4,
            "tur.1": 4,
            "sau.1": 3,
            "club.friendly": 1,
            "fifa.friendly": 1
        };

        // --- FORMATIMI ORËS 24 ORË ---
        function formatDateTime(utcDateStr) {
            if (!utcDateStr) return "--:--";
            const date = new Date(utcDateStr);
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const timeStr = `${hours}:${minutes}`;
            const isSameDay = (d1, d2) =>
                d1.getDate() === d2.getDate() &&
                d1.getMonth() === d2.getMonth() &&
                d1.getFullYear() === d2.getFullYear();
            if (isSameDay(date, today)) return `Sot ${timeStr}`;
            if (isSameDay(date, tomorrow)) return `Nesër ${timeStr}`;
            const days = ["E Diel", "E Hënë", "E Martë", "E Mërkurë", "E Enjte", "E Premte", "E Shtunë"];
            const dayName = days[date.getDay()];
            const dayNum = String(date.getDate()).padStart(2, '0');
            const monthNum = String(date.getMonth() + 1).padStart(2, '0');
            return `${dayName} (${dayNum}/${monthNum}) ${timeStr}`;
        }

        // --- GENERATE ODDS (lokale) ---
        function generateOdds(m) {
            const hStr = m.homeTeam.length;
            const aStr = m.awayTeam.length;
            let hOdd = (1.40 + (aStr % 3) * 0.45).toFixed(2);
            let dOdd = (3.25 + (hStr % 2) * 0.30).toFixed(2);
            let aOdd = (2.10 + (hStr % 4) * 0.60).toFixed(2);
            return { homeWin: hOdd, draw: dOdd, awayWin: aOdd };
        }

        function renderOddsMini(m) {
            const odds = generateOdds(m);
            return `
                <div class="play-odds-mini">
                    <div class="play-odd-mini"><span class="odd-label">1</span> <span class="odd-val">${odds.homeWin}</span></div>
                    <div class="play-odd-mini"><span class="odd-label">X</span> <span class="odd-val">${odds.draw}</span></div>
                    <div class="play-odd-mini"><span class="odd-label">2</span> <span class="odd-val">${odds.awayWin}</span></div>
                </div>
            `;
        }

        // --- FUNKSIONE NDIHMËSE ---
        function isWithinNext7Days(dateStr) {
            if (!dateStr) return false;
            const matchDate = new Date(dateStr);
            const now = new Date();
            const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const endOf7Days = new Date(startOfToday.getTime() + (7 * 24 * 60 * 60 * 1000));
            return matchDate >= startOfToday && matchDate < endOf7Days;
        }

        function isMajorLeague(leagueName, slug) {
            const str = ((leagueName || '') + ' ' + (slug || '')).toLowerCase();
            if (str.includes("u19") || str.includes("u21") || str.includes("u18") ||
                str.includes("u23") || str.includes("women") || str.includes("femra") ||
                str.includes("reserve") || str.includes("2. bundesliga") || str.includes("laliga2") ||
                str.includes("serie b") || str.includes("ligue 2") || str.includes("championship")) {
                return false;
            }
            const allowedKeywords = [
                "premier league", "la liga", "laliga", "serie a", "bundesliga", "ligue 1",
                "champions league", "europa league", "conference league", "superiore",
                "albi mall", "kosovo", "shqiperi", "albania", "nations league", "world cup",
                "euro", "fa cup", "copa del rey", "coppa italia", "dfb pokal", "eredivisie",
                "primeira liga", "super lig", "saudi pro", "friendly", "amika"
            ];
            return allowedKeywords.some(kw => str.includes(kw));
        }

        function parseLiveMinute(statusObj) {
            if (!statusObj) return "LIVE";
            const detail = statusObj.type?.shortDetail || statusObj.type?.detail || "";
            if (detail) {
                const lower = detail.toLowerCase();
                if (lower.includes("ht") || lower.includes("half") || lower.includes("pushim")) return "HT";
                const matchMin = detail.match(/(\d+\+?\d*)/);
                if (matchMin) return `${matchMin[1]}'`;
                if (detail.includes("'")) {
                    const m = detail.match(/(\d+)'/);
                    if (m) return `${m[1]}'`;
                }
                return detail;
            }
            if (statusObj.displayClock) {
                let clk = String(statusObj.displayClock).trim();
                if (clk.includes(":")) clk = clk.split(":")[0];
                if (clk && clk !== "0" && clk !== "00") return `${clk}'`;
            }
            return "LIVE";
        }

        // --- FETCH ME NJË KËRKESË PËR TË GJITHA LIGAT ---
        async function fetchAllMatches() {
            const now = new Date();
            const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const end = new Date(start.getTime() + (7 * 24 * 60 * 60 * 1000) - 1);
            const url = `https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${start.getFullYear()}${String(start.getMonth()+1).padStart(2,'0')}${String(start.getDate()).padStart(2,'0')}-${end.getFullYear()}${String(end.getMonth()+1).padStart(2,'0')}${String(end.getDate()).padStart(2,'0')}`;
            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error("ESPN returned " + resp.status);
                const data = await resp.json();
                return data;
            } catch (e) {
                console.warn("Gabim në fetchAllMatches:", e);
                return null;
            }
        }

        // --- PËRPUNO TË DHËNAT ---
        function processMatches(data) {
            const matches = [];
            if (!data || !data.events) return matches;

            data.events.forEach(event => {
                const comp = event.competitions?.[0];
                if (!comp) return;
                const statusState = event.status?.type?.state;
                const statusName = (event.status?.type?.name || "").toLowerCase();
                const statusDesc = (event.status?.type?.description || "").toLowerCase();
                const isLive = statusState === "in" ||
                    statusName.includes("in_progress") ||
                    statusName.includes("halftime") ||
                    statusDesc.includes("in progress") ||
                    statusDesc.includes("half");
                const isFinished = statusState === "post" || statusName.includes("final");

                const home = comp.competitors?.find(c => c.homeAway === 'home');
                const away = comp.competitors?.find(c => c.homeAway === 'away');
                if (!home || !away) return;

                const homeScorers = [];
                const awayScorers = [];
                if (comp.details) {
                    comp.details.forEach(det => {
                        if (det.type?.text?.toLowerCase().includes("goal")) {
                            const playerName = det.athletesInvolved?.[0]?.displayName || "Gol";
                            const clock = det.clock?.displayValue ? `${det.clock.displayValue}'` : "";
                            const scorerStr = `⚽ ${playerName} ${clock}`;
                            if (det.team?.id === home.id) homeScorers.push(scorerStr);
                            else if (det.team?.id === away.id) awayScorers.push(scorerStr);
                        }
                    });
                }

                const elapsedMin = parseLiveMinute(event.status);
                let leagueName = comp.league?.name || data.leagues?.[0]?.name;
                let leagueSlug = comp.league?.slug || data.leagues?.[0]?.slug || "soccer";
                if (!leagueName || leagueName.toLowerCase() === "soccer") {
                    if (event.season?.slug) leagueName = event.season.slug.replace(/-/g, ' ').toUpperCase();
                    else leagueName = "Futboll Elitar";
                }

                if (isMajorLeague(leagueName, leagueSlug)) {
                    matches.push({
                        id: event.id,
                        leagueCode: leagueSlug,
                        league: leagueName,
                        homeTeam: home.team?.displayName || home.team?.name || "Home",
                        homeId: home.id,
                        homeBadge: home.team?.logo || "https://via.placeholder.com/60",
                        awayTeam: away.team?.displayName || away.team?.name || "Away",
                        awayId: away.id,
                        awayBadge: away.team?.logo || "https://via.placeholder.com/60",
                        time: event.date,
                        isLive: isLive,
                        isFinished: isFinished,
                        elapsed: elapsedMin,
                        scoreHome: home.score !== undefined ? home.score : 0,
                        scoreAway: away.score !== undefined ? away.score : 0,
                        homeScorers,
                        awayScorers
                    });
                }
            });

            return matches;
        }

        // --- FUNKSIONI PËR TË ZGJEDHUR NDESHJEN E DITËS ---
        function getMatchOfDay(matches) {
            if (!matches || matches.length === 0) return null;

            // 1. Nëse ka ndeshje live, ajo është Ndeshja e Ditës
            const liveMatches = matches.filter(m => m.isLive);
            if (liveMatches.length > 0) {
                return liveMatches[0];
            }

            // 2. Përndryshe, zgjedh ndeshjen me ligën më të rëndësishme
            const sorted = [...matches].sort((a, b) => {
                const priorityA = LEAGUE_PRIORITY[a.leagueCode] || 0;
                const priorityB = LEAGUE_PRIORITY[b.leagueCode] || 0;
                return priorityB - priorityA;
            });

            return sorted[0] || null;
        }

        // --- NGARKIMI ME CACHE ---
        async function loadMatches(force = false) {
            const now = Date.now();
            if (!force && cachedMatches && (now - cacheTimestamp) < CACHE_DURATION) {
                matchesData = cachedMatches;
                renderUI(matchesData);
                return;
            }

            if (!cachedMatches) {
                document.getElementById("games").innerHTML = `<div class="empty-state"><div class="loader"></div><br>Duke ngarkuar ndeshjet elitare...</div>`;
            }

            try {
                const data = await fetchAllMatches();
                if (data) {
                    let allMatches = processMatches(data);
                    let weeklyMatches = allMatches.filter(m => !m.isFinished && (m.isLive || isWithinNext7Days(m.time)));
                    weeklyMatches.sort((a, b) => {
                        if (a.isLive && !b.isLive) return -1;
                        if (!a.isLive && b.isLive) return 1;
                        return new Date(a.time) - new Date(b.time);
                    });

                    cachedMatches = weeklyMatches;
                    cacheTimestamp = now;
                    matchesData = weeklyMatches;
                    renderUI(matchesData);
                } else {
                    if (cachedMatches) {
                        matchesData = cachedMatches;
                        renderUI(matchesData);
                    } else {
                        document.getElementById("games").innerHTML = `<div class="empty-state">Nuk u arrit të ngarkoheshin ndeshjet. Kontrollo lidhjen.</div>`;
                    }
                }
            } catch (e) {
                console.error("Gabim në loadMatches:", e);
                if (cachedMatches) {
                    matchesData = cachedMatches;
                    renderUI(matchesData);
                } else {
                    document.getElementById("games").innerHTML = `<div class="empty-state">Gabim gjatë ngarkimit. Provoni përsëri.</div>`;
                }
            }

            clearTimeout(refreshTimer);
            refreshTimer = setTimeout(() => loadMatches(false), 60000);
        }

        // --- RENDER UI (ME NDESHJEN E DITËS) ---
        function renderUI(matches) {
            const container = document.getElementById("games");
            if (!matches || matches.length === 0) {
                container.innerHTML = `<div class="empty-state">Nuk ka ndeshje elitare të programuara për 7 ditët e ardhshme.</div>`;
                cards = [];
                return;
            }

            // Zgjedh Ndeshjen e Ditës
            const matchOfDay = getMatchOfDay(matches);
            // Filtrojmë ndeshjen e ditës nga lista kryesore
            const otherMatches = matchOfDay ? matches.filter(m => m.id !== matchOfDay.id) : matches;

            let html = `<div class="games-grid">`;

            // --- Ndeshja e Ditës ---
            if (matchOfDay) {
                const m = matchOfDay;
                let statusHTML = "";
                let scoreHTML = `<div class="time-box">⏰ ${formatDateTime(m.time)}</div>`;
                let liveCardClass = "";
                if (m.isLive) {
                    liveCardClass = "is-live-card";
                    statusHTML = `<span class="status-badge status-live">🔴 LIVE ${m.elapsed}</span>`;
                    scoreHTML = `<div class="score-box">${m.scoreHome} - ${m.scoreAway}</div>`;
                }
                let scorersHTML = "";
                if (m.homeScorers.length > 0 || m.awayScorers.length > 0) {
                    scorersHTML = `
                        <div class="card-scorers">
                            <div class="home-scorers">${m.homeScorers.map(s => `<div class="scorer-item">${s}</div>`).join('')}</div>
                            <div class="away-scorers">${m.awayScorers.map(s => `<div class="scorer-item">${s}</div>`).join('')}</div>
                        </div>
                    `;
                }
                const oddsMini = renderOddsMini(m);
                html += `
                    <div class="match match-of-day ${liveCardClass}" data-id="${m.id}" data-index="0" tabindex="0" onclick="openMatchDetailsByIndex(0)">
                        <div class="league-header">
                            <span>🏆 ${m.league}</span>
                            <span class="league-brand">${m.isLive ? '🔴 LIVE' : '⭐ NDESHJA E DITËS'}</span>
                        </div>
                        <div class="row">
                            <div class="team home">
                                <img src="${m.homeBadge}" alt="${m.homeTeam}" onerror="this.src='https://via.placeholder.com/60'">
                                <span>${m.homeTeam}</span>
                            </div>
                            <div class="center">
                                ${scoreHTML}
                                ${statusHTML}
                            </div>
                            <div class="team away">
                                <span>${m.awayTeam}</span>
                                <img src="${m.awayBadge}" alt="${m.awayTeam}" onerror="this.src='https://via.placeholder.com/60'">
                            </div>
                        </div>
                        ${scorersHTML}
                        ${oddsMini}
                    </div>
                `;
            }

            // --- Ndeshjet e tjera ---
            otherMatches.forEach((m, idx) => {
                // Indeksi real në array-in origjinal
                const realIndex = matchOfDay ? idx + 1 : idx;
                let statusHTML = "";
                let scoreHTML = `<div class="time-box">⏰ ${formatDateTime(m.time)}</div>`;
                let liveCardClass = "";
                if (m.isLive) {
                    liveCardClass = "is-live-card";
                    statusHTML = `<span class="status-badge status-live">🔴 LIVE ${m.elapsed}</span>`;
                    scoreHTML = `<div class="score-box">${m.scoreHome} - ${m.scoreAway}</div>`;
                }
                let scorersHTML = "";
                if (m.homeScorers.length > 0 || m.awayScorers.length > 0) {
                    scorersHTML = `
                        <div class="card-scorers">
                            <div class="home-scorers">${m.homeScorers.map(s => `<div class="scorer-item">${s}</div>`).join('')}</div>
                            <div class="away-scorers">${m.awayScorers.map(s => `<div class="scorer-item">${s}</div>`).join('')}</div>
                        </div>
                    `;
                }
                const oddsMini = renderOddsMini(m);
                html += `
                    <div class="match ${liveCardClass}" data-id="${m.id}" data-index="${realIndex}" tabindex="0" onclick="openMatchDetailsByIndex(${realIndex})">
                        <div class="league-header">
                            <span>🏆 ${m.league}</span>
                            <span class="league-brand">${m.isLive ? '🔴 LIVE' : 'PLAY SHQIP'}</span>
                        </div>
                        <div class="row">
                            <div class="team home">
                                <img src="${m.homeBadge}" alt="${m.homeTeam}" onerror="this.src='https://via.placeholder.com/60'">
                                <span>${m.homeTeam}</span>
                            </div>
                            <div class="center">
                                ${scoreHTML}
                                ${statusHTML}
                            </div>
                            <div class="team away">
                                <span>${m.awayTeam}</span>
                                <img src="${m.awayBadge}" alt="${m.awayTeam}" onerror="this.src='https://via.placeholder.com/60'">
                            </div>
                        </div>
                        ${scorersHTML}
                        ${oddsMini}
                    </div>
                `;
            });

            html += `</div>`;
            const timeStr = new Date(cacheTimestamp).toLocaleTimeString('sq-AL', { hour: '2-digit', minute: '2-digit' });
            html += `<div class="update-timestamp">🔄 Përditësuar: ${timeStr}</div>`;
            container.innerHTML = html;

            cards = [...document.querySelectorAll(".match")];

            // Fokusi fillestar
            let targetIndex = 0;
            if (focusedMatchId) {
                const found = cards.findIndex(el => el.dataset.id === focusedMatchId);
                if (found !== -1) targetIndex = found;
            }
            if (targetIndex >= cards.length) targetIndex = cards.length - 1;
            if (targetIndex < 0) targetIndex = 0;
            focusIndex = targetIndex;

            cards.forEach((c, i) => {
                if (i === focusIndex) {
                    c.classList.add("tv-focus");
                    c.scrollIntoView({ behavior: "smooth", block: "center" });
                } else {
                    c.classList.remove("tv-focus");
                }
            });
        }

        // --- FUNKSION PËR TË HAPUR NDESHJEN SIPAS INDEKSIT REAL ---
        function openMatchDetailsByIndex(index) {
            // Gjejmë ndeshjen në matchesData
            const match = matchesData[index];
            if (!match) return;
            // Gjejmë indeksin aktual në array
            const realIndex = matchesData.findIndex(m => m.id === match.id);
            if (realIndex !== -1) {
                openMatchDetails(realIndex);
            }
        }

        // --- MODAL FUNKSIONET ---
        async function openMatchDetails(index) {
            activeMatch = matchesData[index];
            if (!activeMatch) return;
            autoScroll = false;
            isPaused = true;
            isModalOpen = true;
            const modal = document.getElementById("matchModal");
            modal.classList.add("active");
            document.getElementById("modalLeague").innerText = activeMatch.league;
            document.getElementById("modalHomeName").innerText = activeMatch.homeTeam;
            document.getElementById("modalHomeLogo").src = activeMatch.homeBadge;
            document.getElementById("modalAwayName").innerText = activeMatch.awayTeam;
            document.getElementById("modalAwayLogo").src = activeMatch.awayBadge;
            document.getElementById("modalScore").innerText = activeMatch.isLive ? `${activeMatch.scoreHome} - ${activeMatch.scoreAway}` : "VS";
            document.getElementById("modalStatus").innerText = activeMatch.isLive ? `🔴 LIVE ${activeMatch.elapsed}` : formatDateTime(activeMatch.time);
            document.getElementById("modalTabContent").innerHTML = `<div class="empty-state"><div class="loader"></div><br>Duke ngarkuar...</div>`;
            modalFocusArea = 'TABS';
            modalTabIndex = 0;
            updateModalUIFocus();

            try {
                const lCode = (activeMatch.leagueCode && activeMatch.leagueCode !== "soccer") ? activeMatch.leagueCode : "all";
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lCode}/summary?event=${activeMatch.id}&_t=${Date.now()}`);
                activeSummary = await res.json();
                renderTabContent(0);
            } catch (e) {
                renderTabContent(0);
            }
        }

        function closeModal() {
            document.getElementById("matchModal").classList.remove("active");
            activeMatch = null;
            activeSummary = null;
            isModalOpen = false;
            if (cards[focusIndex]) {
                focusedMatchId = cards[focusIndex].dataset.id;
                cards.forEach(c => c.classList.remove("tv-focus"));
                cards[focusIndex].classList.add("tv-focus");
                cards[focusIndex].scrollIntoView({ behavior: "smooth", block: "center" });
            }
            setTimeout(() => { autoScroll = true; isPaused = false; }, 3000);
        }

        function switchTab(index) {
            modalTabIndex = index;
            if (index === 5) { closeModal(); return; }
            renderTabContent(index);
            updateModalUIFocus();
        }

        function updateModalUIFocus() {
            for (let i = 0; i < 6; i++) {
                const btn = document.getElementById(`modalTab${i}`);
                if (!btn) continue;
                btn.classList.remove("tv-focus", "active-tab");
                if (i === modalTabIndex && i !== 5) btn.classList.add("active-tab");
                if (modalFocusArea === 'TABS' && i === modalTabIndex) btn.classList.add("tv-focus");
            }
            const body = document.getElementById("modalTabContent");
            if (modalFocusArea === 'BODY') body.classList.add("tv-focus");
            else body.classList.remove("tv-focus");
        }

        function renderTabContent(tabIdx) {
            const el = document.getElementById("modalTabContent");
            if (tabIdx === 0) renderOddsAndFormat(el);
            else if (tabIdx === 1) renderLineups(el);
            else if (tabIdx === 2) renderStats(el);
            else if (tabIdx === 3) renderTimeline(el);
            else if (tabIdx === 4) renderTopPlayers(el);
        }

        // --- FUNKSIONI: Lojtarët më të mirë ---
        function renderTopPlayers(container) {
            const boxscore = activeSummary?.boxscore;
            if (!boxscore || !boxscore.teams || !boxscore.teams[0]?.statistics) {
                container.innerHTML = `<div class="empty-state">Statistikat individuale do të shfaqen gjatë ndeshjes.</div>`;
                return;
            }

            const homeTeam = boxscore.teams[0];
            const awayTeam = boxscore.teams[1];
            
            const homePlayers = homeTeam.statistics?.find(s => s.label === "Players")?.players || [];
            const awayPlayers = awayTeam.statistics?.find(s => s.label === "Players")?.players || [];

            if (homePlayers.length === 0 && awayPlayers.length === 0) {
                container.innerHTML = `<div class="empty-state">Statistikat individuale nuk janë të disponueshme për këtë ndeshje.</div>`;
                return;
            }

            const getTopPlayers = (players) => {
                if (!players || players.length === 0) return [];
                const playerStats = players.map(p => {
                    const stats = p.statistics || [];
                    const findStat = (label) => {
                        const found = stats.find(s => s.label === label);
                        return found ? found.value || found.displayValue || "0" : "0";
                    };
                    const goals = parseFloat(findStat("goals")) || 0;
                    const assists = parseFloat(findStat("assists")) || 0;
                    const shots = parseFloat(findStat("shots")) || 0;
                    const saves = parseFloat(findStat("saves")) || 0;
                    const tackles = parseFloat(findStat("tackles")) || 0;
                    const passAccuracy = findStat("passAccuracy") || "0%";
                    let score = goals * 10 + assists * 5 + saves * 3 + tackles * 2 + shots * 1;
                    return {
                        name: p.athlete?.displayName || p.athlete?.name || "Lojtar",
                        jersey: p.jersey || "",
                        position: p.position?.abbreviation || "",
                        goals, assists, shots, saves, tackles, passAccuracy, score
                    };
                });
                return playerStats.sort((a, b) => b.score - a.score).slice(0, 5);
            };

            const homeTop = getTopPlayers(homePlayers);
            const awayTop = getTopPlayers(awayPlayers);

            const getPlayerStatsText = (p) => {
                let parts = [];
                if (p.goals > 0) parts.push(`⚽ ${p.goals}`);
                if (p.assists > 0) parts.push(`🎯 ${p.assists}`);
                if (p.saves > 0) parts.push(`🧤 ${p.saves}`);
                if (p.tackles > 0) parts.push(`💪 ${p.tackles}`);
                if (p.shots > 0) parts.push(`🎯 ${p.shots} goditje`);
                if (p.passAccuracy !== "0%") parts.push(`✅ ${p.passAccuracy}`);
                return parts.length > 0 ? parts.join(' ') : '📊 Aktiv';
            };

            const renderTeamPlayers = (players) => {
                if (players.length === 0) {
                    return `<div style="color:var(--text-sub); padding:10px 0;">Nuk ka statistika për këtë ekip.</div>`;
                }
                return players.map(p => `
                    <div class="top-player-item">
                        <span class="player-name">${p.jersey ? `#${p.jersey} ` : ''}${p.name} ${p.position ? `<small style="color:var(--text-sub); font-weight:400;">(${p.position})</small>` : ''}</span>
                        <span class="player-stats">${getPlayerStatsText(p)}</span>
                    </div>
                `).join('');
            };

            container.innerHTML = `
                <div class="top-players-grid">
                    <div class="top-player-team">
                        <h3><img src="${activeMatch.homeBadge}" alt="${activeMatch.homeTeam}" onerror="this.style.display='none'"> ${activeMatch.homeTeam}</h3>
                        ${renderTeamPlayers(homeTop)}
                    </div>
                    <div class="top-player-team">
                        <h3><img src="${activeMatch.awayBadge}" alt="${activeMatch.awayTeam}" onerror="this.style.display='none'"> ${activeMatch.awayTeam}</h3>
                        ${renderTeamPlayers(awayTop)}
                    </div>
                </div>
                <div style="text-align:center; margin-top:12px; font-size:13px; color:var(--text-sub); opacity:0.6;">
                    📊 Bazuar në statistikat individuale të ndeshjes
                </div>
            `;
        }

        function generateOddsFull(m) {
            const hStr = m.homeTeam.length;
            const aStr = m.awayTeam.length;
            let hOdd = (1.40 + (aStr % 3) * 0.45).toFixed(2);
            let dOdd = (3.25 + (hStr % 2) * 0.30).toFixed(2);
            let aOdd = (2.10 + (hStr % 4) * 0.60).toFixed(2);
            return { homeWin: hOdd, draw: dOdd, awayWin: aOdd, over25: "1.85", under25: "1.95", bttsYes: "1.75", bttsNo: "2.05" };
        }

        function renderOddsAndFormat(container) {
            const odds = generateOddsFull(activeMatch);
            const rosters = activeSummary?.rosters || [];
            const homeRoster = rosters.find(r => r.team?.id === activeMatch.homeId) || rosters[0];
            const awayRoster = rosters.find(r => r.team?.id === activeMatch.awayId) || rosters[1];
            const homeFormation = homeRoster?.formation || "4-3-3";
            const awayFormation = awayRoster?.formation || "4-2-3-1";

            container.innerHTML = `
                <div class="play-container">
                    <div class="play-badge-header">
                        <div class="play-logo-badge">PLAY SHQIP</div>
                        <div style="font-weight: bold; color: #fff; font-size: 18px;">KOEFICIENTËT & FORMATI</div>
                    </div>
                    <div class="play-odds-grid">
                        <div class="play-odd-card"><div class="odd-title">1 (Fiton ${activeMatch.homeTeam})</div><div class="odd-val">${odds.homeWin}</div></div>
                        <div class="play-odd-card"><div class="odd-title">X (Barazim)</div><div class="odd-val">${odds.draw}</div></div>
                        <div class="play-odd-card"><div class="odd-title">2 (Fiton ${activeMatch.awayTeam})</div><div class="odd-val">${odds.awayWin}</div></div>
                        <div class="play-odd-card"><div class="odd-title">Mbi 2.5 Golash</div><div class="odd-val">${odds.over25}</div></div>
                        <div class="play-odd-card"><div class="odd-title">Nën 2.5 Golash</div><div class="odd-val">${odds.under25}</div></div>
                        <div class="play-odd-card"><div class="odd-title">Dy Ekipet Shënojnë (GG)</div><div class="odd-val">${odds.bttsYes}</div></div>
                    </div>
                    <div class="pitch-container">
                        <div class="pitch-header">
                            <span class="formation-title">📋 SKEMA: ${activeMatch.homeTeam} (${homeFormation}) vs ${activeMatch.awayTeam} (${awayFormation})</span>
                            <span style="color:#000; font-weight:900; font-size:15px; background:var(--play-yellow); padding:4px 14px; border-radius:6px;">PLAY SHQIP FORMAT</span>
                        </div>
                        ${rosters.length > 0 ? `
                            <div class="lineups-grid">
                                <div class="lineup-column">
                                    <h4>🏠 ${activeMatch.homeTeam} (${homeFormation})</h4>
                                    ${(homeRoster?.roster || []).slice(0, 11).map(p => `
                                        <div class="player-row">
                                            <span class="player-num">${p.jersey || '-'}</span>
                                            <span>${p.athlete?.displayName || p.athlete?.name}</span>
                                            <small style="color:var(--play-yellow); margin-left:auto; font-weight:bold;">${p.position?.abbreviation || '11-sh'}</small>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="lineup-column">
                                    <h4>✈️ ${activeMatch.awayTeam} (${awayFormation})</h4>
                                    ${(awayRoster?.roster || []).slice(0, 11).map(p => `
                                        <div class="player-row">
                                            <span class="player-num">${p.jersey || '-'}</span>
                                            <span>${p.athlete?.displayName || p.athlete?.name}</span>
                                            <small style="color:var(--play-yellow); margin-left:auto; font-weight:bold;">${p.position?.abbreviation || '11-sh'}</small>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : `<div class="empty-state" style="padding:20px 0;">Formacionet do të konfirmohen 45 minuta para ndeshjes.</div>`}
                    </div>
                </div>
            `;
        }

        function renderLineups(container) {
            const rosters = activeSummary?.rosters || [];
            if (rosters.length === 0) {
                container.innerHTML = `<div class="empty-state">Formacionet nuk janë publikuar ende.</div>`;
                return;
            }
            const homeRoster = rosters.find(r => r.team?.id === activeMatch.homeId) || rosters[0];
            const awayRoster = rosters.find(r => r.team?.id === activeMatch.awayId) || rosters[1];
            const renderPlayers = (roster, type) => {
                if (!roster || !roster.roster) return "<p>Nuk ka të dhëna</p>";
                let list = type === 'starter' ? roster.roster.filter(p => p.starter || p.subbedIn === false).slice(0, 11) : roster.roster.slice(11);
                if (type === 'starter' && list.length === 0) list = roster.roster.slice(0, 11);
                if (list.length === 0) return "<p style='color:var(--text-sub);'>-</p>";
                return list.map(p => `
                    <div class="player-row">
                        <span class="player-num">${p.jersey || '-'}</span>
                        <span>${p.athlete?.displayName || p.athlete?.name}</span>
                        <small style="color:var(--text-sub); margin-left:auto;">${type === 'starter' ? (p.position?.abbreviation || 'TITULLAR') : 'BENCH'}</small>
                    </div>
                `).join('');
            };

            container.innerHTML = `
                <div class="lineups-grid">
                    <div class="lineup-column">
                        <h4>🏠 ${activeMatch.homeTeam} (${homeRoster?.formation || '11-shja'})</h4>
                        <div class="section-sub-header">🟢 11-SHJA TITULLARE</div>
                        ${renderPlayers(homeRoster, 'starter')}
                        <div class="section-sub-header">🟡 ZËVENDËSUESIT</div>
                        ${renderPlayers(homeRoster, 'sub')}
                    </div>
                    <div class="lineup-column">
                        <h4>✈️ ${activeMatch.awayTeam} (${awayRoster?.formation || '11-shja'})</h4>
                        <div class="section-sub-header">🟢 11-SHJA TITULLARE</div>
                        ${renderPlayers(awayRoster, 'starter')}
                        <div class="section-sub-header">🟡 ZËVENDËSUESIT</div>
                        ${renderPlayers(awayRoster, 'sub')}
                    </div>
                </div>
            `;
        }

        function renderStats(container) {
            const boxscore = activeSummary?.boxscore;
            if (!boxscore || !boxscore.teams) {
                container.innerHTML = `<div class="empty-state">Statistikat live do të shfaqen sapo të nisë ndeshja.</div>`;
                return;
            }
            const homeStats = boxscore.teams[0]?.statistics || [];
            const awayStats = boxscore.teams[1]?.statistics || [];
            const teamStats = homeStats.filter(s => s.label !== "Players");
            if (teamStats.length === 0) {
                container.innerHTML = `<div class="empty-state">Statistikat nuk janë të disponueshme.</div>`;
                return;
            }
            container.innerHTML = teamStats.map((st, i) => {
                const awayVal = awayStats[i]?.displayValue || "0";
                const homeValStr = st.displayValue || "0";
                const hNum = parseFloat(homeValStr) || 0;
                const aNum = parseFloat(awayVal) || 0;
                const total = (hNum + aNum) || 1;
                const hPct = Math.round((hNum / total) * 100);
                return `
                    <div class="stat-row">
                        <div class="stat-labels"><span>${homeValStr}</span><span>${st.label}</span><span>${awayVal}</span></div>
                        <div class="stat-bar-bg">
                            <div class="stat-bar-home" style="width:${hPct}%"></div>
                            <div class="stat-bar-away" style="width:${100-hPct}%"></div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        function renderTimeline(container) {
            const keyEvents = activeSummary?.keyEvents || [];
            if (keyEvents.length === 0) {
                container.innerHTML = `<div class="empty-state">Nuk ka ngjarje të regjistruara ende.</div>`;
                return;
            }
            container.innerHTML = keyEvents.map(e => {
                const clock = e.clock?.displayValue || "";
                const typeText = (e.type?.text || "").toLowerCase();
                const player = e.participants?.[0]?.athlete?.displayName || "";
                const team = e.team?.displayName || "";
                let icon = "⚡";
                if (typeText.includes("goal")) icon = "⚽";
                else if (typeText.includes("yellow card")) icon = "🟨";
                else if (typeText.includes("red card")) icon = "🟥";
                else if (typeText.includes("substitution")) icon = "🔄";
                else if (typeText.includes("penalty")) icon = "🎯";
                else if (typeText.includes("var")) icon = "🖥️";
                return `
                    <div class="timeline-item">
                        <div class="timeline-time"><span>${clock}'</span><span>${icon}</span></div>
                        <div><strong style="color:#fff;">${team}</strong>: <span style="color:var(--gold-accent); font-weight:bold;">${e.type?.text || 'Ngjarje'}</span> ${player ? `- <span style="color:#ff8a80;">${player}</span>` : ''}</div>
                    </div>
                `;
            }).join("");
        }

        // --- TELEKOMANDA ---
        const KEY_UP = ["ArrowUp", 38, 19];
        const KEY_DOWN = ["ArrowDown", 40, 20];
        const KEY_LEFT = ["ArrowLeft", 37, 21];
        const KEY_RIGHT = ["ArrowRight", 39, 22];
        const KEY_ENTER = ["Enter", 13, 23, 29443];
        const KEY_BACK = ["Escape", "Back", 27, 8, 4, 10009, 461];

        function isKey(e, keyArray) {
            return keyArray.includes(e.key) || keyArray.includes(e.keyCode);
        }

        document.addEventListener("keydown", e => {
            if (isModalOpen) {
                if (isKey(e, KEY_BACK)) { e.preventDefault(); closeModal(); return; }
                const body = document.getElementById("modalTabContent");
                if (modalFocusArea === 'TABS') {
                    if (isKey(e, KEY_LEFT)) { e.preventDefault(); modalTabIndex = (modalTabIndex - 1 + 6) % 6; updateModalUIFocus(); }
                    else if (isKey(e, KEY_RIGHT)) { e.preventDefault(); modalTabIndex = (modalTabIndex + 1) % 6; updateModalUIFocus(); }
                    else if (isKey(e, KEY_DOWN)) { e.preventDefault(); modalFocusArea = 'BODY'; updateModalUIFocus(); }
                    else if (isKey(e, KEY_ENTER)) { e.preventDefault(); switchTab(modalTabIndex); }
                } else if (modalFocusArea === 'BODY') {
                    if (isKey(e, KEY_DOWN)) { e.preventDefault(); body.scrollTop += 90; }
                    else if (isKey(e, KEY_UP)) {
                        e.preventDefault();
                        if (body.scrollTop <= 10) { modalFocusArea = 'TABS'; updateModalUIFocus(); }
                        else body.scrollTop -= 90;
                    } else if (isKey(e, KEY_LEFT) || isKey(e, KEY_RIGHT)) {
                        e.preventDefault();
                        modalFocusArea = 'TABS';
                        if (isKey(e, KEY_LEFT)) modalTabIndex = (modalTabIndex - 1 + 6) % 6;
                        if (isKey(e, KEY_RIGHT)) modalTabIndex = (modalTabIndex + 1) % 6;
                        updateModalUIFocus();
                    }
                }
                return;
            }

            if (!cards.length) return;
            autoScroll = false;
            isPaused = true;
            clearTimeout(scrollRestartTimer);
            scrollRestartTimer = setTimeout(() => { if (!isModalOpen) { autoScroll = true; isPaused = false; } }, 6000);

            cards.forEach(c => c.classList.remove("tv-focus"));
            if (isKey(e, KEY_DOWN) || isKey(e, KEY_RIGHT)) {
                e.preventDefault();
                focusIndex = (focusIndex + 1) % cards.length;
            } else if (isKey(e, KEY_UP) || isKey(e, KEY_LEFT)) {
                e.preventDefault();
                focusIndex = (focusIndex - 1 + cards.length) % cards.length;
            } else if (isKey(e, KEY_ENTER)) {
                e.preventDefault();
                if (cards[focusIndex]) focusedMatchId = cards[focusIndex].dataset.id;
                // Gjej indeksin real në matchesData
                const matchId = cards[focusIndex].dataset.id;
                const realIndex = matchesData.findIndex(m => m.id === matchId);
                if (realIndex !== -1) openMatchDetails(realIndex);
                return;
            }
            if (cards[focusIndex]) {
                cards[focusIndex].classList.add("tv-focus");
                cards[focusIndex].scrollIntoView({ behavior: "smooth", block: "center" });
            }
        });

        // --- AUTO-SCROLL ---
        const wrapEl = document.querySelector(".wrap");
        function smoothScroll(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = timestamp - lastTimestamp;
            lastTimestamp = timestamp;
            if (autoScroll && !isPaused && !isModalOpen && wrapEl) {
                if (scrollSpeed < targetSpeed) scrollSpeed += 0.08;
                const pixels = scrollSpeed * (delta / 16);
                if (wrapEl.scrollHeight > wrapEl.clientHeight) {
                    wrapEl.scrollTop += pixels;
                    if (wrapEl.scrollTop >= wrapEl.scrollHeight - wrapEl.clientHeight) {
                        wrapEl.scrollTop = 0;
                        scrollSpeed = targetSpeed * 0.6;
                    }
                }
            } else {
                if (scrollSpeed > 0) { scrollSpeed *= 0.97; if (scrollSpeed < 0.01) scrollSpeed = 0; }
            }
            requestAnimationFrame(smoothScroll);
        }

        requestAnimationFrame(smoothScroll);
        window.focus();
        document.body.setAttribute('tabindex', '0');
        document.body.focus();

        loadMatches(true);
    </script>
</body>

</html>
