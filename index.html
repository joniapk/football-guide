<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Play Shqip - Ndeshjet e Ardhshme</title>

    <style>
        :root {
            --bg-main: #070a0f;
            --card-bg: linear-gradient(145deg, #160a0a, #0d0303);
            --card-border: #2a1010;
            --accent-red: #e10600;
            --text-main: #ffffff;
            --text-sub: #a0a5b5;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            background: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .header {
            height: 75px;
            background: #0a0101;
            border-bottom: 2px solid var(--accent-red);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 4px 20px rgba(225, 6, 0, 0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
        }

        .play-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid var(--accent-red);
        }

        .logo-text span {
            font-size: 24px;
            color: #fff;
            letter-spacing: 1px;
            display: block;
        }

        .logo-text small {
            font-size: 11px;
            color: var(--accent-red);
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(225, 6, 0, 0.15);
            border: 1px solid var(--accent-red);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: var(--accent-red);
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 6, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(225, 6, 0, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 6, 0, 0); }
        }

        .wrap {
            height: calc(100vh - 75px);
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-red) #0b0e14;
        }

        .match {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 18px 24px;
            margin-bottom: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .tv-focus {
            border: 2px solid var(--accent-red) !important;
            transform: scale(1.02);
            box-shadow: 0 0 22px rgba(225, 6, 0, 0.7) !important;
            outline: none;
        }

        .league-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #d19ca0;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 14px;
            border-bottom: 1px dashed #2d1414;
            padding-bottom: 8px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team {
            width: 38%;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 19px;
            font-weight: 800;
        }

        .team.home { justify-content: flex-start; text-align: left; }
        .team.away { justify-content: flex-end; text-align: right; }

        .team img {
            width: 46px;
            height: 46px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .center {
            text-align: center;
            min-width: 140px;
        }

        .score-box {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 2px;
            background: #1e0505;
            padding: 4px 16px;
            border-radius: 10px;
            border: 1px solid #4a1010;
            display: inline-block;
        }

        .time-box {
            font-size: 17px;
            color: #ff8a80;
            font-weight: bold;
        }

        .status-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-live {
            background: var(--accent-red);
            color: #fff;
            animation: pulse 1.5s infinite;
        }

        .status-upcoming {
            background: #201212;
            color: #ff8a80;
            border: 1px solid #5c1d1d;
        }

        .broadcasters {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .channel-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(225, 6, 0, 0.1);
            border: 1px solid var(--accent-red);
            padding: 3px 8px;
            border-radius: 6px;
            color: #ff5252;
            font-size: 11px;
            font-weight: bold;
        }

        .channel-tag img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            border-radius: 3px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-sub);
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">
            <img class="play-logo" src="https://i.ibb.co/Kpd6bW8X/logo-256.png" alt="Play Shqip Logo" onerror="this.src='https://via.placeholder.com/48?text=PS'">
            <div class="logo-text">
                <span>PLAY SHQIP</span>
                <small>ESPN LIVE & UPCOMING MATCHES</small>
            </div>
        </div>

        <div class="live-indicator">
            <div class="pulse-dot"></div>
            <span>NDESHJET E ARDHSHME</span>
        </div>
    </div>

    <div class="wrap" id="games">
        <div class="empty-state">Duke ngarkuar ndeshjet nga ESPN...</div>
    </div>

    <script>
        // LOGOT E KANALEVE TV
        const tvLogos = {
            "Super Sport AL": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkn0aMGtp1VLY3UMIrfsiyD1PBe-k-NBvnRtZOWep4iQ&s=10",
            "Tring Sport AL": "https://play-lh.googleusercontent.com/xj8GLCiviP_leV_eIzw3o-MLIzkNx7Uq6lW3VT7u9A3ZhpMenjJQyzc2egadTkEKSIaOnyIg4UASqUO2VL-nGQ",
            "Art Sport KS": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8GbjNRnIknmPljrVN4I0qixtO3cClJOnmvg&s",
            "RTSH Sport AL": "https://r2.thesportsdb.com/images/media/channel/logo/nfdq4d1630964082.png"
        };

        function getBroadcasters(leagueName) {
            let channels = [];
            const l = (leagueName || "").toLowerCase();

            if (l.includes("premier") || l.includes("la liga") || l.includes("bundesliga") || 
                l.includes("ligue 1") || l.includes("europa") || l.includes("conference") || 
                l.includes("nations") || l.includes("world cup") || l.includes("euro")) {
                channels.push("Super Sport AL");
            }

            if (l.includes("serie a") || l.includes("champions") || l.includes("coppa italia") || l.includes("primeira")) {
                channels.push("Tring Sport AL");
            }

            if (l.includes("champions") || l.includes("europa") || l.includes("conference") || 
                l.includes("serie a") || l.includes("la liga") || l.includes("ligue 1")) {
                channels.push("Art Sport KS");
            }

            if (l.includes("albania") || l.includes("superliga") || l.includes("shqiperi") || l.includes("kupa") || l.includes("rtsh")) {
                channels.push("RTSH Sport AL");
            }

            if (channels.length === 0) {
                channels.push("Super Sport AL", "Art Sport KS");
            }

            channels = [...new Set(channels)];

            return channels.map(ch => `
                <div class="channel-tag">
                    <img src="${tvLogos[ch] || 'https://via.placeholder.com/18'}" alt="${ch}">
                    ${ch}
                </div>
            `).join("");
        }

        let cards = [];
        let focusIndex = 0;
        let autoScroll = true;
        let refreshTimer = null;

        function formatDateTime(utcDateStr) {
            if (!utcDateStr) return "--:--";
            const date = new Date(utcDateStr);
            const today = new Date();
            
            const isToday = date.getDate() === today.getDate() &&
                            date.getMonth() === today.getMonth() &&
                            date.getFullYear() === today.getFullYear();

            const timeStr = date.toLocaleTimeString("sq-AL", { hour: "2-digit", minute: "2-digit", hour12: false });
            
            if (isToday) {
                return timeStr;
            } else {
                return `${date.getDate()}/${date.getMonth()+1} - ${timeStr}`;
            }
        }

        // VETËM ESPN LEAGUES
        const ESPN_LEAGUES = [
            "eng.1",           // Premier League
            "esp.1",           // La Liga
            "ita.1",           // Serie A
            "ger.1",           // Bundesliga
            "fra.1",           // Ligue 1
            "uefa.champions",  // Champions League
            "uefa.europa",     // Europa League
            "uefa.europa.conf",// Conference League
            "fifa.world",      // Ndeshje Ndërkombëtare / Miqësore
            "uefa.nations",    // Nations League
            "por.1",           // Primeira Liga
            "ned.1"            // Eredivisie
        ];

        async function fetchESPNLeagues() {
            const matches = [];
            const fetches = ESPN_LEAGUES.map(league => 
                fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/scoreboard`)
                    .then(r => r.ok ? r.json() : null)
                    .catch(() => null)
            );

            const results = await Promise.all(fetches);

            results.forEach(data => {
                if (!data || !data.events) return;
                data.events.forEach(event => {
                    const comp = event.competitions?.[0];
                    if (!comp) return;

                    const home = comp.competitors?.find(c => c.homeAway === 'home');
                    const away = comp.competitors?.find(c => c.homeAway === 'away');
                    const statusState = event.status?.type?.state; // "pre", "in", "post"

                    matches.push({
                        id: event.id,
                        league: comp.league?.name || data.leagues?.[0]?.name || "Evropë",
                        homeTeam: home?.team?.displayName || home?.team?.name || "Home",
                        homeBadge: home?.team?.logo || "https://via.placeholder.com/46",
                        awayTeam: away?.team?.displayName || away?.team?.name || "Away",
                        awayBadge: away?.team?.logo || "https://via.placeholder.com/46",
                        time: event.date,
                        isLive: statusState === "in",
                        isFinished: statusState === "post",
                        elapsed: event.status?.displayClock || event.status?.type?.shortDetail || "",
                        scoreHome: home?.score ?? 0,
                        scoreAway: away?.score ?? 0
                    });
                });
            });

            return matches;
        }

        // FUNKSIONI KRYESOR
        async function loadMatches() {
            try {
                console.log("Po ngarkoj ndeshjet nga ESPN...");
                
                let allMatches = await fetchESPNLeagues();

                // Fshi duplikatat sipas ID
                const uniqueMap = new Map();
                allMatches.forEach(m => uniqueMap.set(m.id, m));
                allMatches = Array.from(uniqueMap.values());

                // Filtro ndeshjet e përfunduara
                let activeMatches = allMatches.filter(m => !m.isFinished);

                // Nëse nuk ka ndeshje aktivisht në këtë moment, shfaq ndeshjet e gjetura
                if (activeMatches.length === 0 && allMatches.length > 0) {
                    activeMatches = allMatches;
                }

                // Renditja: Ndeshjet LIVE të parat, pastaj sipas orarit
                activeMatches.sort((a, b) => {
                    if (a.isLive && !b.isLive) return -1;
                    if (!a.isLive && b.isLive) return 1;
                    return new Date(a.time) - new Date(b.time);
                });

                renderUI(activeMatches);

            } catch (err) {
                console.error("Gabim gjatë ngarkimit:", err);
                document.getElementById("games").innerHTML = `<div class="empty-state">Ndodhi një gabim gjatë marrjes së të dhënave nga ESPN.</div>`;
            }

            clearTimeout(refreshTimer);
            refreshTimer = setTimeout(loadMatches, 40000); // Rrifresko çdo 40 sekonda
        }

        function renderUI(matches) {
            const container = document.getElementById("games");

            if (matches.length === 0) {
                container.innerHTML = `<div class="empty-state">Nuk ka ndeshje të gjetura për momentin në ESPN.</div>`;
                return;
            }

            container.innerHTML = matches.map(m => {
                let statusHTML = `<span class="status-badge status-upcoming">⏰ ${formatDateTime(m.time)}</span>`;
                let scoreHTML = `<div class="time-box">${formatDateTime(m.time)}</div>`;

                if (m.isLive) {
                    statusHTML = `<span class="status-badge status-live">🔴 LIVE ${m.elapsed ? m.elapsed : ''}</span>`;
                    scoreHTML = `<div class="score-box">${m.scoreHome} - ${m.scoreAway}</div>`;
                }

                return `
                    <div class="match" tabindex="0">
                        <div class="league-header">
                            <span>🏆 ${m.league}</span>
                            <span>PLAY SHQIP</span>
                        </div>

                        <div class="row">
                            <div class="team home">
                                <img src="${m.homeBadge}" alt="${m.homeTeam}" onerror="this.src='https://via.placeholder.com/46'">
                                <span>${m.homeTeam}</span>
                            </div>

                            <div class="center">
                                ${scoreHTML}
                                ${statusHTML}
                            </div>

                            <div class="team away">
                                <span>${m.awayTeam}</span>
                                <img src="${m.awayBadge}" alt="${m.awayTeam}" onerror="this.src='https://via.placeholder.com/46'">
                            </div>
                        </div>

                        <div class="broadcasters">
                            ${getBroadcasters(m.league)}
                        </div>
                    </div>
                `;
            }).join("");

            cards = [...document.querySelectorAll(".match")];
            focusIndex = 0;
            if (cards[0]) cards[0].classList.add("tv-focus");
        }

        // KONTROLLI ME TELEKOMANDË (SHIGJETAT)
        document.addEventListener("keydown", e => {
            if (!cards.length) return;

            autoScroll = false;
            setTimeout(() => { autoScroll = true; }, 10000);

            cards.forEach(c => c.classList.remove("tv-focus"));

            if (e.key === "ArrowDown") {
                focusIndex = (focusIndex + 1) % cards.length;
            } else if (e.key === "ArrowUp") {
                focusIndex = (focusIndex - 1 + cards.length) % cards.length;
            }

            if (cards[focusIndex]) {
                cards[focusIndex].classList.add("tv-focus");
                cards[focusIndex].scrollIntoView({ behavior: "smooth", block: "center" });
            }
        });

        // AUTO-SCROLL AUTOMATIK
        const wrapEl = document.querySelector(".wrap");
        (function autoScrollLoop() {
            if (autoScroll && wrapEl.scrollHeight > wrapEl.clientHeight) {
                wrapEl.scrollTop += 1;
                if (wrapEl.scrollTop >= wrapEl.scrollHeight - wrapEl.clientHeight) {
                    wrapEl.scrollTop = 0;
                }
            }
            requestAnimationFrame(autoScrollLoop);
        })();

        // NISJA
        loadMatches();
    </script>
</body>

</html>
