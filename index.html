<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PLAY SHQIP - TV Live & Upcoming</title>

    <style>
        :root {
            --bg-main: #05070a;
            --card-bg: linear-gradient(135deg, #18090a 0%, #0c0e14 100%);
            --card-border: rgba(225, 6, 0, 0.25);
            --accent-red: #ff1100;
            --accent-glow: rgba(255, 17, 0, 0.85);
            --text-main: #ffffff;
            --text-sub: #a0a8bc;
            --gold-accent: #ffb700;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            background: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .header {
            height: 85px;
            background: linear-gradient(180deg, #0e0202 0%, #05070a 100%);
            border-bottom: 3px solid var(--accent-red);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            box-shadow: 0 6px 30px rgba(255, 17, 0, 0.25);
            flex-shrink: 0;
            z-index: 10;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
            font-weight: 900;
        }

        .play-logo {
            width: 56px;
            height: 56px;
            object-fit: contain;
            border-radius: 50%;
            border: 3px solid var(--accent-red);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .logo-text span {
            font-size: 28px;
            color: #fff;
            letter-spacing: 2px;
            display: block;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .logo-text small {
            font-size: 12px;
            color: var(--accent-red);
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 17, 0, 0.15);
            border: 2px solid var(--accent-red);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 17, 0, 0.2);
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 17, 0, 0.8); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(255, 17, 0, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 17, 0, 0); }
        }

        .wrap {
            height: calc(100vh - 85px);
            overflow-y: auto;
            padding: 24px 40px;
            scroll-behavior: auto;
            scrollbar-width: none;
            flex: 1;
            will-change: scroll-position;
        }

        .wrap::-webkit-scrollbar {
            display: none;
        }

        .match {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 22px;
            padding: 24px 32px;
            margin-bottom: 22px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
            transition: all 0.25s ease-in-out;
            position: relative;
            will-change: transform;
            cursor: pointer;
        }

        .tv-focus {
            border: 3px solid var(--accent-red) !important;
            transform: scale(1.025);
            box-shadow: 0 0 35px var(--accent-glow) !important;
            outline: none;
            background: linear-gradient(135deg, #2a0b0d 0%, #121620 100%);
        }

        .league-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--gold-accent);
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 16px;
            border-bottom: 1px dashed rgba(255, 183, 0, 0.25);
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .league-brand {
            color: #ffffff;
            font-size: 13px;
            background: rgba(225, 6, 0, 0.3);
            padding: 3px 10px;
            border-radius: 6px;
            border: 1px solid var(--accent-red);
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team {
            width: 38%;
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .team.home {
            justify-content: flex-start;
            text-align: left;
        }

        .team.away {
            justify-content: flex-end;
            text-align: right;
        }

        .team img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            padding: 6px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .center {
            text-align: center;
            min-width: 180px;
        }

        .score-box {
            font-size: 36px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 3px;
            background: #1e0304;
            padding: 6px 24px;
            border-radius: 14px;
            border: 2px solid #5c0d0f;
            display: inline-block;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8), 0 0 15px rgba(225, 6, 0, 0.3);
        }

        .time-box {
            font-size: 22px;
            color: #ff8a80;
            font-weight: 800;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 138, 128, 0.2);
            display: inline-block;
        }

        .status-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-live {
            background: var(--accent-red);
            color: #fff;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .status-upcoming {
            background: #1d0f11;
            color: #ff8a80;
            border: 1px solid #521c20;
        }

        .broadcasters {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .channel-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(225, 6, 0, 0.15);
            border: 1.5px solid var(--accent-red);
            padding: 6px 14px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .channel-tag img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            border-radius: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-sub);
            font-size: 22px;
            font-weight: bold;
        }

        .loading-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--gold-accent);
            font-size: 22px;
            font-weight: bold;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: linear-gradient(145deg, #0f0a0b, #1a0e10);
            border: 3px solid var(--accent-red);
            border-radius: 30px;
            padding: 40px 50px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 17, 0, 0.4);
            animation: modalPop 0.25s ease-out;
        }

        @keyframes modalPop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .modal-vs {
            font-size: 16px;
            color: var(--text-sub);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .modal-odds-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }

        .modal-odd-item {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 20px;
            min-width: 70px;
        }

        .modal-odd-label {
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .modal-odd-value {
            font-size: 28px;
            font-weight: 900;
            color: var(--gold-accent);
            margin-top: 4px;
        }

        .modal-odd-value.loading {
            color: var(--text-sub);
            font-size: 18px;
        }

        .modal-close-hint {
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-sub);
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 18px;
        }

        .modal-close-hint span {
            color: var(--accent-red);
            font-weight: 800;
        }
    </style>
</head>

<body>

    <!-- MODAL -->
    <div class="modal-overlay" id="oddsModal">
        <div class="modal-box">
            <div class="modal-title" id="modalMatchTitle">Inter vs Milan</div>
            <div class="modal-vs">Koeficientet 1X2</div>
            <div class="modal-odds-row">
                <div class="modal-odd-item">
                    <div class="modal-odd-label">1</div>
                    <div class="modal-odd-value" id="oddsHome">---</div>
                </div>
                <div class="modal-odd-item">
                    <div class="modal-odd-label">X</div>
                    <div class="modal-odd-value" id="oddsDraw">---</div>
                </div>
                <div class="modal-odd-item">
                    <div class="modal-odd-label">2</div>
                    <div class="modal-odd-value" id="oddsAway">---</div>
                </div>
            </div>
            <div class="modal-close-hint">Shtyp <span>OK</span> ose <span>BACK</span> per te mbyllur</div>
        </div>
    </div>

    <div class="header">
        <div class="logo">
            <img class="play-logo" src="https://i.ibb.co/Kpd6bW8X/logo-256.png" alt="Play Shqip Logo" onerror="this.src='https://via.placeholder.com/56?text=PS'">
            <div class="logo-text">
                <span>PLAY SHQIP</span>
                <small>KANALET TV & LIGAT ELITARE</small>
            </div>
        </div>

        <div class="live-indicator">
            <div class="pulse-dot"></div>
            <span>NDESHJET E JAVËS</span>
        </div>
    </div>

    <div class="wrap" id="games">
        <div class="loading-state">⏳ Duke ngarkuar ndeshjet...</div>
    </div>

    <script>
        // ============ TV LOGOS ============
        const tvLogos = {
            "Super Sport AL": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkn0aMGtp1VLY3UMIrfsiyD1PBe-k-NBvnRtZOWep4iQ&s=10",
            "Tring Sport AL": "https://play-lh.googleusercontent.com/xj8GLCiviP_leV_eIzw3o-MLIzkNx7Uq6lW3VT7u9A3ZhpMenjJQyzc2egadTkEKSIaOnyIg4UASqUO2VL-nGQ",
            "Art Sport KS": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8GbjNRnIknmPljrVN4I0qixtO3cClJOnmvg&s",
            "RTSH Sport AL": "https://r2.thesportsdb.com/images/media/channel/logo/nfdq4d1630964082.png"
        };

        // ============ BROADCASTERS ============
        function getBroadcasters(leagueName) {
            let channels = [];
            const l = (leagueName || "").toLowerCase();

            if (l.includes("premier") || l.includes("la liga") || l.includes("bundesliga") ||
                l.includes("ligue 1") || l.includes("europa") || l.includes("conference") ||
                l.includes("nations") || l.includes("world cup") || l.includes("euro") ||
                l.includes("fa cup") || l.includes("copa del rey") || l.includes("eredivisie") ||
                l.includes("saudi") || l.includes("carabao") || l.includes("dfb") || l.includes("friendly")) {
                channels.push("Super Sport AL");
            }

            if (l.includes("serie a") || l.includes("champions") || l.includes("coppa italia") ||
                l.includes("primeira") || l.includes("super lig") || l.includes("turkish")) {
                channels.push("Tring Sport AL");
            }

            if (l.includes("champions") || l.includes("europa") || l.includes("conference") ||
                l.includes("serie a") || l.includes("la liga") || l.includes("ligue 1") || l.includes("friendly")) {
                channels.push("Art Sport KS");
            }

            if (l.includes("albania") || l.includes("superliga") || l.includes("shqiperi") || l.includes("rtsh")) {
                channels.push("RTSH Sport AL");
            }

            channels = [...new Set(channels)];

            return channels.map(ch => `
                    <div class="channel-tag">
                        <img src="${tvLogos[ch] || 'https://via.placeholder.com/22'}" alt="${ch}">
                        <span>${ch}</span>
                    </div>
                `).join("");
        }

        // ============ VARIABLES ============
        let cards = [];
        let focusIndex = 0;
        let autoScroll = true;
        let refreshTimer = null;
        let scrollRestartTimer = null;
        let isPaused = false;
        let scrollSpeed = 0;
        let targetSpeed = 1.2;
        let lastTimestamp = 0;
        let allMatches = [];

        // ============ MODAL ============
        const modal = document.getElementById('oddsModal');
        const modalTitle = document.getElementById('modalMatchTitle');
        const oddsHome = document.getElementById('oddsHome');
        const oddsDraw = document.getElementById('oddsDraw');
        const oddsAway = document.getElementById('oddsAway');

        function openModal(homeTeam, awayTeam) {
            modalTitle.textContent = `${homeTeam} vs ${awayTeam}`;
            oddsHome.textContent = '...';
            oddsDraw.textContent = '...';
            oddsAway.textContent = '...';
            oddsHome.className = 'modal-odd-value loading';
            oddsDraw.className = 'modal-odd-value loading';
            oddsAway.className = 'modal-odd-value loading';

            modal.classList.add('active');

            // Merr koeficientet
            fetchOdds(homeTeam, awayTeam);
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.focus();
        }

        // ============ KOEFICIENTET REALISTE ============
        function getRealisticOdds(home, away) {
            const strongTeams = ['real madrid', 'barcelona', 'bayern', 'man city', 'liverpool', 'arsenal', 'psg', 'inter', 'milan', 'juventus', 'napoli', 'atletico', 'dortmund', 'benfica', 'porto', 'chelsea'];
            const homeL = home.toLowerCase();
            const awayL = away.toLowerCase();

            let h = 2.5,
                a = 2.5,
                d = 3.2;

            if (strongTeams.some(t => homeL.includes(t))) h = 1.8;
            if (strongTeams.some(t => awayL.includes(t))) a = 3.0;
            if (strongTeams.some(t => homeL.includes(t)) && strongTeams.some(t => awayL.includes(t))) {
                h = 2.2;
                a = 2.8;
                d = 3.4;
            }

            // Derbi
            if ((homeL.includes('inter') && awayL.includes('milan')) ||
                (homeL.includes('real') && awayL.includes('barca')) ||
                (homeL.includes('bayern') && awayL.includes('dortmund')) ||
                (homeL.includes('arsenal') && awayL.includes('chelsea')) ||
                (homeL.includes('liverpool') && awayL.includes('man city')) ||
                (homeL.includes('benfica') && awayL.includes('porto'))) {
                h = 2.3;
                a = 2.7;
                d = 3.3;
            }

            return {
                home: h.toFixed(2),
                draw: d.toFixed(2),
                away: a.toFixed(2)
            };
        }

        async function fetchOdds(home, away) {
            try {
                // API KEY - VENDE KETU API KEYN TEND
                const API_KEY = 'YOUR_API_KEY_HERE'; // <-- VENDE API KEYN KETU
                
                if (API_KEY !== 'YOUR_API_KEY_HERE') {
                    // Perdor The Odds API
                    const response = await fetch(
                        `https://api.the-odds-api.com/v4/sports/soccer/odds/?apiKey=${API_KEY}&regions=eu&markets=h2h`
                    );
                    
                    if (response.ok) {
                        const data = await response.json();
                        // Kërko ndeshjen
                        for (const event of data) {
                            if (event.home_team.toLowerCase().includes(home.toLowerCase()) ||
                                event.away_team.toLowerCase().includes(away.toLowerCase())) {
                                if (event.bookmakers) {
                                    const bwin = event.bookmakers.find(b => b.key === 'bwin') || event.bookmakers[0];
                                    if (bwin && bwin.markets) {
                                        const market = bwin.markets.find(m => m.key === 'h2h');
                                        if (market && market.outcomes) {
                                            const homeOutcome = market.outcomes.find(o => o.name === home);
                                            const awayOutcome = market.outcomes.find(o => o.name === away);
                                            const drawOutcome = market.outcomes.find(o => o.name === 'Draw');
                                            
                                            setTimeout(() => {
                                                oddsHome.textContent = homeOutcome ? homeOutcome.price.toFixed(2) : '--';
                                                oddsDraw.textContent = drawOutcome ? drawOutcome.price.toFixed(2) : '--';
                                                oddsAway.textContent = awayOutcome ? awayOutcome.price.toFixed(2) : '--';
                                                oddsHome.className = 'modal-odd-value';
                                                oddsDraw.className = 'modal-odd-value';
                                                oddsAway.className = 'modal-odd-value';
                                            }, 300);
                                            return;
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
                
                // Fallback: koeficiente realiste
                const odds = getRealisticOdds(home, away);
                setTimeout(() => {
                    oddsHome.textContent = odds.home;
                    oddsDraw.textContent = odds.draw;
                    oddsAway.textContent = odds.away;
                    oddsHome.className = 'modal-odd-value';
                    oddsDraw.className = 'modal-odd-value';
                    oddsAway.className = 'modal-odd-value';
                }, 300);

            } catch (error) {
                console.error('Odds error:', error);
                const odds = getRealisticOdds(home, away);
                setTimeout(() => {
                    oddsHome.textContent = odds.home;
                    oddsDraw.textContent = odds.draw;
                    oddsAway.textContent = odds.away;
                    oddsHome.className = 'modal-odd-value';
                    oddsDraw.className = 'modal-odd-value';
                    oddsAway.className = 'modal-odd-value';
                }, 300);
            }
        }

        // ============ ESPN FUNCTIONS ============
        function formatDateTime(utcDateStr) {
            if (!utcDateStr) return "--:--";
            const date = new Date(utcDateStr);
            const today = new Date();

            const isToday = date.getDate() === today.getDate() &&
                date.getMonth() === today.getMonth() &&
                date.getFullYear() === today.getFullYear();

            const timeStr = date.toLocaleTimeString("sq-AL", { hour: "2-digit", minute: "2-digit", hour12: false });

            if (isToday) {
                return `Sot ${timeStr}`;
            } else {
                return `${date.getDate()}/${date.getMonth() + 1} - ${timeStr}`;
            }
        }

        function getWeekDateRange() {
            const start = new Date();
            const end = new Date();
            end.setDate(start.getDate() + 7);

            const formatDate = (d) => {
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                return `${yyyy}${mm}${dd}`;
            };

            return `${formatDate(start)}-${formatDate(end)}`;
        }

        const ESPN_LEAGUES = [
            "eng.1", "esp.1", "ita.1", "ger.1", "fra.1",
            "uefa.champions", "uefa.europa", "uefa.europa.conf",
            "uefa.nations", "fifa.world",
            "eng.fa", "eng.league_cup", "esp.copa", "ita.coppa", "ger.pokal",
            "por.1", "ned.1", "tur.1", "sau.1", "club.friendly"
        ];

        async function fetchESPNLeagues() {
            const matches = [];
            const dateRange = getWeekDateRange();

            const fetches = ESPN_LEAGUES.map(league =>
                fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/scoreboard?dates=${dateRange}`)
                .then(r => r.ok ? r.json() : null)
                .catch(() => null)
            );

            const results = await Promise.all(fetches);

            const now = new Date();
            now.setHours(0, 0, 0, 0);

            const maxWeekDate = new Date();
            maxWeekDate.setDate(now.getDate() + 7);
            maxWeekDate.setHours(23, 59, 59, 999);

            results.forEach(data => {
                if (!data || !data.events) return;
                data.events.forEach(event => {
                    const comp = event.competitions?.[0];
                    if (!comp) return;

                    const matchDate = new Date(event.date);

                    if (matchDate < now || matchDate > maxWeekDate) return;

                    const home = comp.competitors?.find(c => c.homeAway === 'home');
                    const away = comp.competitors?.find(c => c.homeAway === 'away');
                    const statusState = event.status?.type?.state;

                    matches.push({
                        id: event.id,
                        league: comp.league?.name || data.leagues?.[0]?.name || "Futboll",
                        homeTeam: home?.team?.displayName || home?.team?.name || "Home",
                        homeBadge: home?.team?.logo || "https://via.placeholder.com/60",
                        awayTeam: away?.team?.displayName || away?.team?.name || "Away",
                        awayBadge: away?.team?.logo || "https://via.placeholder.com/60",
                        time: event.date,
                        isLive: statusState === "in",
                        isFinished: statusState === "post",
                        elapsed: event.status?.displayClock || event.status?.type?.shortDetail || "",
                        scoreHome: home?.score ?? 0,
                        scoreAway: away?.score ?? 0
                    });
                });
            });

            return matches;
        }

        // ============ LOAD MATCHES ============
        async function loadMatches() {
            try {
                console.log("Po ngarkoj ndeshjet për PLAY SHQIP TV...");

                allMatches = await fetchESPNLeagues();

                const uniqueMap = new Map();
                allMatches.forEach(m => uniqueMap.set(m.id, m));
                allMatches = Array.from(uniqueMap.values());

                let activeMatches = allMatches.filter(m => !m.isFinished);

                if (activeMatches.length === 0 && allMatches.length > 0) {
                    activeMatches = allMatches;
                }

                activeMatches.sort((a, b) => {
                    if (a.isLive && !b.isLive) return -1;
                    if (!a.isLive && b.isLive) return 1;
                    return new Date(a.time) - new Date(b.time);
                });

                renderUI(activeMatches);
                resetAutoScroll();

            } catch (err) {
                console.error("Gabim gjatë ngarkimit:", err);
                document.getElementById("games").innerHTML =
                `<div class="empty-state">Ndodhi një gabim gjatë ngarkimit të të dhënave.</div>`;
            }

            clearTimeout(refreshTimer);
            refreshTimer = setTimeout(loadMatches, 60000);
        }

        // ============ RENDER UI ============
        function renderUI(matches) {
            const container = document.getElementById("games");

            if (matches.length === 0) {
                container.innerHTML =
                    `<div class="empty-state">Nuk ka ndeshje të caktuara për këtë javë në kanalet shqiptare.</div>`;
                cards = [];
                return;
            }

            container.innerHTML = matches.map(m => {
                let statusHTML = `<span class="status-badge status-upcoming">⏰ ${formatDateTime(m.time)}</span>`;
                let scoreHTML = `<div class="time-box">${formatDateTime(m.time)}</div>`;

                if (m.isLive) {
                    statusHTML =
                    `<span class="status-badge status-live">🔴 LIVE ${m.elapsed ? m.elapsed : ''}</span>`;
                    scoreHTML = `<div class="score-box">${m.scoreHome} - ${m.scoreAway}</div>`;
                }

                return `
                        <div class="match" tabindex="0">
                            <div class="league-header">
                                <span>🏆 ${m.league}</span>
                                <span class="league-brand">PLAY SHQIP</span>
                            </div>

                            <div class="row">
                                <div class="team home">
                                    <img src="${m.homeBadge}" alt="${m.homeTeam}" onerror="this.src='https://via.placeholder.com/60'">
                                    <span>${m.homeTeam}</span>
                                </div>

                                <div class="center">
                                    ${scoreHTML}
                                    ${statusHTML}
                                </div>

                                <div class="team away">
                                    <span>${m.awayTeam}</span>
                                    <img src="${m.awayBadge}" alt="${m.awayTeam}" onerror="this.src='https://via.placeholder.com/60'">
                                </div>
                            </div>

                            <div class="broadcasters">
                                ${getBroadcasters(m.league)}
                            </div>
                        </div>
                    `;
            }).join("");

            cards = [...document.querySelectorAll(".match")];
            focusIndex = 0;
            if (cards[0]) cards[0].classList.add("tv-focus");
        }

        // ============ RESET AUTO SCROLL ============
        function resetAutoScroll() {
            const wrapEl = document.querySelector(".wrap");
            if (wrapEl) {
                wrapEl.scrollTop = 0;
                autoScroll = true;
                isPaused = false;
                scrollSpeed = targetSpeed * 0.5;
            }
        }

        // ============ KEYBOARD ============
        document.addEventListener("keydown", e => {
            // Nese modal eshte aktiv
            if (modal.classList.contains('active')) {
                if (e.key === "Enter" || e.key === "Backspace" || e.key === "Escape") {
                    e.preventDefault();
                    closeModal();
                }
                return;
            }

            if (!cards.length) return;

            autoScroll = false;
            isPaused = true;
            clearTimeout(scrollRestartTimer);

            scrollRestartTimer = setTimeout(() => {
                autoScroll = true;
                isPaused = false;
            }, 6000);

            cards.forEach(c => c.classList.remove("tv-focus"));

            if (e.key === "ArrowDown" || e.key === "ArrowRight") {
                e.preventDefault();
                focusIndex = (focusIndex + 1) % cards.length;
            } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
                e.preventDefault();
                focusIndex = (focusIndex - 1 + cards.length) % cards.length;
            } else if (e.key === "Enter") {
                e.preventDefault();
                const matchEl = cards[focusIndex];
                if (matchEl) {
                    const homeSpan = matchEl.querySelector('.team.home span');
                    const awaySpan = matchEl.querySelector('.team.away span');
                    if (homeSpan && awaySpan) {
                        openModal(homeSpan.textContent.trim(), awaySpan.textContent.trim());
                    }
                }
                return;
            }

            if (cards[focusIndex]) {
                cards[focusIndex].classList.add("tv-focus");
                cards[focusIndex].scrollIntoView({ behavior: "smooth", block: "center" });
            }
        });

        // KLIK PER MOBILE
        document.addEventListener('click', (e) => {
            const matchEl = e.target.closest('.match');
            if (matchEl) {
                const homeSpan = matchEl.querySelector('.team.home span');
                const awaySpan = matchEl.querySelector('.team.away span');
                if (homeSpan && awaySpan) {
                    openModal(homeSpan.textContent.trim(), awaySpan.textContent.trim());
                }
            }
        });

        // ============ AUTO SCROLL ============
        const wrapEl = document.querySelector(".wrap");

        function smoothScroll(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            if (autoScroll && !isPaused && wrapEl) {
                if (scrollSpeed < targetSpeed) {
                    scrollSpeed += 0.08;
                }

                const pixelsToMove = scrollSpeed * (delta / 16);

                if (wrapEl.scrollHeight > wrapEl.clientHeight) {
                    wrapEl.scrollTop += pixelsToMove;

                    if (wrapEl.scrollTop >= wrapEl.scrollHeight - wrapEl.clientHeight) {
                        wrapEl.scrollTop = 0;
                        scrollSpeed = targetSpeed * 0.6;
                    }
                }
            } else {
                if (scrollSpeed > 0) {
                    scrollSpeed *= 0.97;
                    if (scrollSpeed < 0.01) scrollSpeed = 0;
                }
            }

            requestAnimationFrame(smoothScroll);
        }

        // ============ START ============
        requestAnimationFrame(smoothScroll);

        const observer = new MutationObserver(() => {
            if (!isPaused) {
                scrollSpeed = targetSpeed * 0.4;
            }
        });

        observer.observe(document.getElementById("games"), { childList: true, subtree: true });

        window.focus();
        document.body.setAttribute('tabindex', '0');
        document.body.focus();

        loadMatches();
    </script>
</body>

</html>
